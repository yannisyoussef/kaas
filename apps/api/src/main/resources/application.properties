management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${KAAS_HEALTH_SHOW_DETAILS:never}
management.endpoint.health.group.liveness.include=livenessState
# Readiness deliberately excludes the broker: a RabbitMQ outage must not stop the API serving reads.
management.endpoint.health.group.readiness.include=readinessState,db
# For the same reason the broker indicator is kept out of the aggregate status entirely. A broker outage is
# a relay concern, observable through kaas.outbox.* metrics and the outboxRelay backlog details, not a
# reason to report the control plane as unhealthy and have an orchestrator remove it from service.
management.health.rabbit.enabled=false

spring.datasource.url=${KAAS_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/kaas}
spring.datasource.username=${KAAS_DATABASE_USERNAME:kaas}
spring.datasource.password=${KAAS_DATABASE_PASSWORD:kaas-local-only}
spring.datasource.hikari.maximum-pool-size=${KAAS_DATASOURCE_POOL_SIZE:20}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# The non-routable defaults keep local health startup fail-closed. A deployment must configure its trusted issuer/JWK set.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KAAS_OIDC_ISSUER_URI:https://oidc.invalid/issuer}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KAAS_OIDC_JWK_SET_URI:https://oidc.invalid/jwks}
spring.security.oauth2.resourceserver.jwt.audiences=${KAAS_OIDC_AUDIENCE:kaas-api}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=RS256

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.read.strict-duplicate-detection=true
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Execution of user-supplied test content. Not a feature toggle: there is no code behind it, and the
# application refuses to start if it is set, because the prerequisites — source capability issuance, secret
# capability issuance, an egress policy model, and a passing hostile-execution assessment on the deployment's
# own runtime — do not exist. A passing sandbox assessment is one of those prerequisites, not permission.
kaas.execution.enabled=${KAAS_EXECUTION_ENABLED:false}

# Execution authorization. Owning an attempt is not permission to execute it; these bound the separate
# authority that is.
#
# The attestation is ABSENT BY DEFAULT and that is the correct production state. It is the hostile-execution
# gate's structured assessment, and without one every authorization is refused with SECURITY_GATE_UNAVAILABLE.
# It is deliberately not a boolean: supplying it means supplying every mandatory control and its verdict, and
# there is no endpoint that accepts one, so nothing that authenticates to this service can assert its own
# security posture.
kaas.execution.sandbox-attestation=${KAAS_EXECUTION_SANDBOX_ATTESTATION:}
kaas.execution.security-profile-version=${KAAS_EXECUTION_SECURITY_PROFILE_VERSION:kaas.sandbox.v1}
# How stale an assessment may be. It describes a running host rather than a source tree, so a host reconfigured
# after the assessment was taken is not described by it.
kaas.execution.attestation-max-age=${KAAS_EXECUTION_ATTESTATION_MAX_AGE:PT24H}
# Never longer than the lease it is issued under; the shorter of the two always wins.
kaas.execution.authorization-ttl=${KAAS_EXECUTION_AUTHORIZATION_TTL:PT5M}
kaas.execution.capability-ttl=${KAAS_EXECUTION_CAPABILITY_TTL:PT5M}

kaas.api.max-request-bytes=1048576
kaas.feature.max-source-bytes=524288
kaas.engine.karate-version=${KAAS_KARATE_ENGINE_VERSION:2.0.0}
kaas.scheduling.queue-timeout=${KAAS_QUEUE_TIMEOUT:PT5M}

# Tenant admission. Server-controlled only: no request, header, or token claim can influence these. They exist
# to bound amplification, not to price anything.
kaas.admission.max-active-runs-per-organization=${KAAS_MAX_ACTIVE_RUNS:200}
kaas.admission.max-queued-runs-per-organization=${KAAS_MAX_QUEUED_RUNS:50}

# Durable scheduler backoff. Distinct from broker publication retry and from execution retry.
kaas.scheduling.backoff.max-failures=${KAAS_SCHEDULING_MAX_FAILURES:8}
kaas.scheduling.backoff.base-delay=${KAAS_SCHEDULING_BASE_DELAY:PT5S}
kaas.scheduling.backoff.max-delay=${KAAS_SCHEDULING_MAX_DELAY:PT10M}
# Jitter, for the same reason the relay needs it: a database blip fails a whole pass at once, and an
# unjittered backlog re-converges on one instant and re-fails together.
kaas.scheduling.backoff.jitter=${KAAS_SCHEDULING_BACKOFF_JITTER:0.25}

# CREATED -> QUEUED production trigger. Bounded batch, fixed delay, safe across replicas via compare-and-set.
kaas.scheduling.auto.enabled=${KAAS_SCHEDULING_ENABLED:true}
kaas.scheduling.auto.interval=${KAAS_SCHEDULING_INTERVAL:PT2S}
kaas.scheduling.auto.initial-delay=${KAAS_SCHEDULING_INITIAL_DELAY:PT5S}
kaas.scheduling.batch-size=${KAAS_SCHEDULING_BATCH_SIZE:50}

# Queue-deadline reaping. A deadline nothing enforces is a field, not a promise: an unclaimed run would hold an
# organization's queued and active capacity forever. Slower than the scheduler on purpose — a deadline that has
# already passed is not more urgent for having passed a second ago, and this pass writes terminal state.
kaas.reaping.auto.enabled=${KAAS_REAPING_ENABLED:true}
kaas.reaping.auto.interval=${KAAS_REAPING_INTERVAL:PT10S}
kaas.reaping.auto.initial-delay=${KAAS_REAPING_INITIAL_DELAY:PT10S}
kaas.reaping.batch-size=${KAAS_REAPING_BATCH_SIZE:50}

# Reaping has its own budget rather than sharing the scheduler's, because the two park very different things.
# A quarantined CREATED run is one cheap row waiting for an operator. A quarantined QUEUED run is still holding
# an active and a queued admission slot, which is the exact condition reaping exists to clear — so it is given a
# far longer rope before it gives up, and only a sustained partial outage can spend it.
kaas.reaping.backoff.max-failures=${KAAS_REAPING_MAX_FAILURES:50}
kaas.reaping.backoff.base-delay=${KAAS_REAPING_BASE_DELAY:PT10S}
kaas.reaping.backoff.max-delay=${KAAS_REAPING_MAX_DELAY:PT10M}
kaas.reaping.backoff.jitter=${KAAS_REAPING_BACKOFF_JITTER:0.25}

# Outbox relay. Retry timing is owned by PostgreSQL, not by this process.
kaas.outbox.relay.enabled=${KAAS_RELAY_ENABLED:true}
kaas.outbox.relay.interval=${KAAS_RELAY_INTERVAL:PT1S}
kaas.outbox.relay.initial-delay=${KAAS_RELAY_INITIAL_DELAY:PT5S}
# batch-size x confirm-timeout must stay comfortably below claim-ttl, or a slow broker lets the lease expire
# mid-batch. The relay cross-validates this at startup and also stops a batch before its own lease runs out.
kaas.outbox.relay.batch-size=${KAAS_RELAY_BATCH_SIZE:20}
kaas.outbox.relay.claim-ttl=${KAAS_RELAY_CLAIM_TTL:PT5M}
# The budget must span a routine broker restart or failover. A short budget would dead-letter every pending
# dispatch during ordinary maintenance: 12 attempts with a 5-minute cap is roughly 50 minutes.
kaas.outbox.relay.max-attempts=${KAAS_RELAY_MAX_ATTEMPTS:12}
kaas.outbox.relay.base-backoff=${KAAS_RELAY_BASE_BACKOFF:PT10S}
kaas.outbox.relay.max-backoff=${KAAS_RELAY_MAX_BACKOFF:PT5M}
# Jitter spreads a backlog that all failed in the same tick instead of letting it re-converge on one instant.
kaas.outbox.relay.backoff-jitter=${KAAS_RELAY_BACKOFF_JITTER:0.25}

# Worker claim, lease, and recovery. The canonical lifecycle profile: a 30-second lease renewed every 10
# seconds, and a 30-second recovery window after expiry before the assignment is fenced. The window exists so a
# worker that misses one heartbeat to a GC pause or a brief partition is not punished for it.
kaas.claim.lease-duration=${KAAS_CLAIM_LEASE_DURATION:PT30S}
kaas.claim.recovery-window=${KAAS_CLAIM_RECOVERY_WINDOW:PT30S}
kaas.claim.reconcile.enabled=${KAAS_CLAIM_RECONCILE_ENABLED:true}
kaas.claim.reconcile.interval=${KAAS_CLAIM_RECONCILE_INTERVAL:PT5S}
kaas.claim.reconcile.initial-delay=${KAAS_CLAIM_RECONCILE_INITIAL_DELAY:PT10S}
kaas.claim.reconcile.batch-size=${KAAS_CLAIM_RECONCILE_BATCH_SIZE:50}

# Dispatch consumption. The worker instance id is server-controlled audit identity: it records which instance an
# assignment was handed to, and never decides whether that instance may do anything.
#
# DEFAULTED OFF, and not because the consumer is unfinished — it is implemented, proven end to end against a real
# broker, and safe to enable. It is off because nothing in this repository can yet send a heartbeat. With the
# consumer on and no heartbeating worker, every run is claimed within a second and then loses its lease sixty
# seconds later, terminalizing FAILED / LEASE_LOST / CLAIM. That is a *false* diagnosis: it says the platform
# reached the run and lost the worker holding it, when no worker ever existed. Before this slice the same run
# ended TIMED_OUT / QUEUE_DEADLINE — "the platform never got to it" — which was true.
#
# Enable it when a worker that heartbeats exists. Until then the honest failure is the one the queue deadline
# already gives.
kaas.consumer.enabled=${KAAS_CONSUMER_ENABLED:false}
kaas.consumer.name=${KAAS_CONSUMER_NAME:kaas.dispatch-consumer}
kaas.consumer.worker-instance-id=${KAAS_WORKER_INSTANCE_ID:kaas.worker.local}
kaas.consumer.concurrency=${KAAS_CONSUMER_CONCURRENCY:2}
# Paces requeue while the control plane itself is unhealthy. Without it a database outage becomes a hot loop:
# every delivery fails instantly, is requeued instantly, and is redelivered instantly. The work is deliberately
# requeued rather than dead-lettered, because nothing is wrong with the message.
kaas.consumer.transient-backoff=${KAAS_CONSUMER_TRANSIENT_BACKOFF:PT1S}

kaas.outbox.rabbit.exchange=${KAAS_RABBIT_EXCHANGE:kaas.dispatch}
kaas.outbox.rabbit.queue=${KAAS_RABBIT_QUEUE:kaas.execution-dispatch}
kaas.outbox.rabbit.routing-key=${KAAS_RABBIT_ROUTING_KEY:execution-dispatch}
# Consumer-side dead lettering, which is a different problem from publisher terminal failure: this holds messages
# that were delivered and could not be believed, not messages that could not be sent.
kaas.outbox.rabbit.dead-letter-exchange=${KAAS_RABBIT_DLX:kaas.dispatch.dlx}
kaas.outbox.rabbit.dead-letter-queue=${KAAS_RABBIT_DLQ:kaas.execution-dispatch.dlq}
# Bounded, because anyone who can publish to the dispatch exchange can fill this queue and a full broker disk
# blocks every publisher on the node — including the relay, which would stop the control plane dispatching at all.
kaas.outbox.rabbit.dead-letter-max-messages=${KAAS_RABBIT_DLQ_MAX_MESSAGES:10000}
kaas.outbox.rabbit.dead-letter-ttl=${KAAS_RABBIT_DLQ_TTL:P7D}
kaas.outbox.rabbit.confirm-timeout=${KAAS_RABBIT_CONFIRM_TIMEOUT:PT5S}

# Credentials are configuration, never code. The local defaults match the loopback-only Compose broker.
spring.rabbitmq.host=${KAAS_RABBIT_HOST:127.0.0.1}
spring.rabbitmq.port=${KAAS_RABBIT_PORT:5672}
spring.rabbitmq.virtual-host=${KAAS_RABBIT_VHOST:/}
spring.rabbitmq.username=${KAAS_RABBIT_USERNAME:kaas}
spring.rabbitmq.password=${KAAS_RABBIT_PASSWORD:kaas-local-only}
spring.rabbitmq.ssl.enabled=${KAAS_RABBIT_SSL_ENABLED:false}
# A blackholed broker would otherwise block the relay thread for the amqp-client default of 60 seconds per
# message. The relay retries on its next tick, so failing fast is strictly better.
spring.rabbitmq.connection-timeout=${KAAS_RABBIT_CONNECTION_TIMEOUT:5s}
# Correlated confirms plus returns are what let the relay distinguish confirmed, nacked, and unroutable.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Four independent timers now: scheduling, relay, queue-deadline reaping, and lease reconciliation. A pool
# smaller than the number of timers would let a slow pass delay an unrelated one.
spring.task.scheduling.pool.size=${KAAS_BACKGROUND_POOL_SIZE:4}
# The container acknowledges only after the listener returns, and the listener returns only after the database
# has committed. That ordering is the safety property: acknowledging on delivery would lose work on any process
# death between the two, with the broker believing it was handled.
spring.rabbitmq.listener.simple.acknowledge-mode=auto
# A plain exception means "we failed, not the message" and must come back. A message the consumer has durably
# refused throws AmqpRejectAndDontRequeueException instead, which is never requeued whatever this says.
spring.rabbitmq.listener.simple.default-requeue-rejected=true
# One in flight per consumer thread. A large prefetch would let one thread hold messages it cannot decide while
# a healthy thread sits idle, and every held message is one the broker will redeliver after a crash.
spring.rabbitmq.listener.simple.prefetch=1

logging.structured.format.console=logstash
