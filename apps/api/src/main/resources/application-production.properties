# The production profile (SPRING_PROFILES_ACTIVE=production). Everything here is a deployment policy; every value
# a host decides -- addresses, credentials, accept-lists -- still comes from the environment.

# THE APPLICATION DOES NOT MIGRATE. The migrator command owns schema mutation, with the migrator credential; the
# application runs as a role that cannot run DDL, and refuses to start against a schema it was not built for
# (SchemaGuard). Not overridable from the environment here: a production deployment that migrates on startup is
# not this profile.
spring.flyway.enabled=false

# The dispatch consumer runs in production: it corroborates each delivered dispatch and records it for a worker
# to claim. It claims nothing itself.
kaas.consumer.enabled=${KAAS_CONSUMER_ENABLED:true}

# Dispatch recovery runs in production (KAAS-MSG-001): a published dispatch RabbitMQ lost before the consumer
# recorded it is republished from PostgreSQL. RabbitMQ state is not what keeps queued work alive.
kaas.dispatch.recovery.enabled=${KAAS_DISPATCH_RECOVERY_ENABLED:true}

# Management on its own port, never through public ingress. Operations binds and routes it; the defaults only
# make it reachable inside the container network.
management.server.port=${KAAS_MANAGEMENT_PORT:8081}
management.server.address=${KAAS_MANAGEMENT_ADDRESS:0.0.0.0}
management.endpoints.web.exposure.include=health,prometheus,deployment
management.endpoint.health.show-details=never
