openapi: 3.1.0
info:
  title: KaaS Control Plane API
  version: 1.0.0
  description: >-
    Project, immutable FeatureRevision, SecretReference metadata, immutable EnvironmentRevision, and immutable
    RunProfileRevision operations and TestRun create/get/list/snapshot are implemented. Run cancellation, events,
    results, and artifacts remain proposed contracts only. Authentication and tenant authorization are required;
    arbitrary execution remains disabled. Implemented JSON mutation requests are
    limited to 1048576 encoded bytes, and decoded Feature source is limited to 524288 UTF-8 bytes.
  license:
    name: All rights reserved
    identifier: LicenseRef-Proprietary
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Projects
    description: Implemented organization-scoped project operations.
  - name: Features
    description: Implemented logical feature and immutable revision operations. Source is opaque and never executed here.
  - name: Secret References
    description: Implemented logical metadata only. No secret value, provider location, or redeemable capability is stored.
  - name: Environments
    description: Implemented project-scoped Environment identities and immutable typed configuration revisions.
  - name: Run Profiles
    description: Implemented project-scoped RunProfile identities whose immutable revisions pin EnvironmentRevisions.
  - name: Runs
    description: Implemented CREATED intent/snapshot operations plus explicitly proposed lifecycle/result operations. Every lookup is authorized against trusted organization/project ownership.
paths:
  /api/v1/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects in the authenticated organization
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Authenticated organization projects in stable newest-first order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create an organization-scoped project
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProjectRequest'}
      responses:
        '201':
          description: Project created, or the original successful response replayed.
          headers:
            Location: {$ref: '#/components/headers/ResourceLocation'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /api/v1/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get one tenant-scoped project
      responses:
        '200':
          description: Tenant-scoped project.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /api/v1/projects/{projectId}/features:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Features]
      operationId: listFeatures
      summary: List logical features in a project
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Tenant- and project-scoped logical features.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeaturePage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
    post:
      tags: [Features]
      operationId: createFeature
      summary: Create a feature and immutable revision 1
      description: Atomically creates a logical Feature and immutable revision 1. Source is stored as opaque text and is not parsed or executed.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateFeatureRequest'}
      responses:
        '201':
          description: Feature and initial revision created, or the original success replayed.
          headers:
            Location: {$ref: '#/components/headers/ResourceLocation'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedFeature'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /api/v1/projects/{projectId}/features/{featureId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/FeatureId'
    get:
      tags: [Features]
      operationId: getFeature
      summary: Get logical feature metadata
      responses:
        '200':
          description: Logical feature metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Feature'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /api/v1/projects/{projectId}/features/{featureId}/revisions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/FeatureId'
    get:
      tags: [Features]
      operationId: listFeatureRevisions
      summary: List immutable feature revision metadata
      description: Lists revision metadata only; source is returned only by the item endpoint.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Immutable revision history in descending revision-number order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeatureRevisionPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
    post:
      tags: [Features]
      operationId: createFeatureRevision
      summary: Append the next immutable feature revision
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateFeatureRevisionRequest'}
      responses:
        '201':
          description: Next immutable revision created, or the original success replayed.
          headers:
            Location: {$ref: '#/components/headers/ResourceLocation'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeatureRevision'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /api/v1/projects/{projectId}/features/{featureId}/revisions/{revisionId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/FeatureId'
      - $ref: '#/components/parameters/RevisionId'
    get:
      tags: [Features]
      operationId: getFeatureRevision
      summary: Get one exact immutable feature revision
      responses:
        '200':
          description: One exact immutable source revision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeatureRevision'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /api/v1/projects/{projectId}/secret-references:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Secret References]
      operationId: listSecretReferences
      summary: List project-scoped logical secret-reference metadata
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Safe logical metadata only; no value or provider data exists.
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecretReferencePage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
    post:
      tags: [Secret References]
      operationId: createSecretReference
      summary: Create logical secret-reference metadata
      description: >-
        Creates a non-capability project-scoped identity. The API cannot accept, store, reveal, or redeem a secret value,
        provider, provider path, URI, token, ciphertext, or credential.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSecretReferenceRequest'}
      responses:
        '201':
          description: Logical metadata created, or the original success replayed.
          headers:
            Location: {$ref: '#/components/headers/ResourceLocation'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
            Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecretReference'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /api/v1/projects/{projectId}/secret-references/{secretReferenceId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SecretReferenceId'
    get:
      tags: [Secret References]
      operationId: getSecretReference
      summary: Get logical secret-reference metadata
      responses:
        '200':
          description: Safe logical metadata only.
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecretReference'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /api/v1/projects/{projectId}/environments:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Environments]
      operationId: listEnvironments
      summary: List logical Environments in a project
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Tenant- and project-scoped logical Environments.
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnvironmentPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
    post:
      tags: [Environments]
      operationId: createEnvironment
      summary: Create an Environment and immutable revision 1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateEnvironmentRequest'}
      responses:
        '201':
          description: Environment and initial revision created, or the original success replayed.
          headers:
            Location: {$ref: '#/components/headers/ResourceLocation'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
            Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedEnvironment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /api/v1/projects/{projectId}/environments/{environmentId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/EnvironmentId'
    get:
      tags: [Environments]
      operationId: getEnvironment
      summary: Get logical Environment metadata
      responses:
        '200':
          description: Stable logical Environment metadata.
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Environment'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /api/v1/projects/{projectId}/environments/{environmentId}/revisions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/EnvironmentId'
    get:
      tags: [Environments]
      operationId: listEnvironmentRevisions
      summary: List immutable Environment revision metadata
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Revision metadata only, newest revision number first.
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnvironmentRevisionPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
    post:
      tags: [Environments]
      operationId: createEnvironmentRevision
      summary: Append the next immutable Environment revision
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateEnvironmentRevisionRequest'}
      responses:
        '201':
          description: Next immutable revision created, or the original success replayed.
          headers:
            Location: {$ref: '#/components/headers/ResourceLocation'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
            Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnvironmentRevision'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /api/v1/projects/{projectId}/environments/{environmentId}/revisions/{revisionId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/EnvironmentId'
      - $ref: '#/components/parameters/RevisionId'
    get:
      tags: [Environments]
      operationId: getEnvironmentRevision
      summary: Get one immutable Environment revision
      responses:
        '200':
          description: Exact typed variables and logical secret bindings for this revision.
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnvironmentRevision'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /api/v1/projects/{projectId}/run-profiles:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Run Profiles]
      operationId: listRunProfiles
      summary: List logical RunProfiles in a project
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Tenant- and project-scoped logical RunProfiles.
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunProfilePage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
    post:
      tags: [Run Profiles]
      operationId: createRunProfile
      summary: Create a RunProfile and immutable revision 1
      description: The initial revision pins one exact EnvironmentRevision and cannot silently follow later changes.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRunProfileRequest'}
      responses:
        '201':
          description: RunProfile and initial revision created, or the original success replayed.
          headers:
            Location: {$ref: '#/components/headers/ResourceLocation'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
            Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedRunProfile'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /api/v1/projects/{projectId}/run-profiles/{runProfileId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/RunProfileId'
    get:
      tags: [Run Profiles]
      operationId: getRunProfile
      summary: Get logical RunProfile metadata
      responses:
        '200':
          description: Stable logical RunProfile metadata.
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunProfile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /api/v1/projects/{projectId}/run-profiles/{runProfileId}/revisions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/RunProfileId'
    get:
      tags: [Run Profiles]
      operationId: listRunProfileRevisions
      summary: List immutable RunProfile revision metadata
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Revision metadata only, newest revision number first.
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunProfileRevisionPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
    post:
      tags: [Run Profiles]
      operationId: createRunProfileRevision
      summary: Append the next immutable RunProfile revision
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRunProfileRevisionRequest'}
      responses:
        '201':
          description: Next immutable revision created, or the original success replayed.
          headers:
            Location: {$ref: '#/components/headers/ResourceLocation'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
            Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunProfileRevision'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /api/v1/projects/{projectId}/run-profiles/{runProfileId}/revisions/{revisionId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/RunProfileId'
      - $ref: '#/components/parameters/RevisionId'
    get:
      tags: [Run Profiles]
      operationId: getRunProfileRevision
      summary: Get one immutable RunProfile revision
      responses:
        '200':
          description: Exact settings and the pinned EnvironmentRevision identity.
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunProfileRevision'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /api/v1/projects/{projectId}/runs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Runs]
      operationId: createRun
      summary: Persist a CREATED test-run intent and immutable snapshot
      x-kaas-implementation-status: IMPLEMENTED
      description: >-
        Atomically records a CREATED run, its immutable execution snapshot, and the scoped idempotency record. The
        response does not imply that a command was generated or published, or that the run reached QUEUED. An
        identical replay returns the original status, body, Location, and ETag. Reusing the
        same key in the same authenticated organization, operation, and project scope with a different normalized
        request fingerprint returns an idempotency conflict.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '202':
          description: Run intent was durably accepted; scheduling may not have started.
          headers:
            Location:
              $ref: '#/components/headers/RunLocation'
            ETag:
              $ref: '#/components/headers/RunEtag'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationProblem'
    get:
      tags: [Runs]
      operationId: listProjectRuns
      summary: List test runs in one authorized project
      x-kaas-implementation-status: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Stable page ordered by createdAt descending and runId descending.
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /api/v1/runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: getRun
      summary: Get the canonical run representation
      x-kaas-implementation-status: IMPLEMENTED
      responses:
        '200':
          description: Current run state and independent outcome dimensions.
          headers:
            ETag:
              $ref: '#/components/headers/RunEtag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/runs/{runId}/snapshot:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: getRunSnapshot
      summary: Get the immutable materialized execution snapshot
      x-kaas-implementation-status: IMPLEMENTED
      description: >-
        Returns exact revision provenance, typed effective non-secret configuration, metadata-only secret references,
        profile settings, and the server-owned engine descriptor. It never resolves secret values or creates an
        execution command.
      responses:
        '200':
          description: The persisted snapshot; the read path does not re-resolve mutable inputs.
          headers:
            ETag:
              description: Strong tag derived from the immutable snapshot digest.
              schema: {type: string}
            Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSnapshot'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/runs/{runId}/cancellations:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      operationId: cancelRun
      summary: Request cancellation without deleting the run
      x-kaas-implementation-status: PROPOSED
      description: >-
        Creates the single cancellation intent for a run. Repeating an accepted request is idempotent. CREATED or
        QUEUED may complete cancellation immediately; an active worker phase transitions toward STOPPING. A request
        after result processing has begun is a lifecycle conflict because accepted evidence wins the race.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancellationRequest'
      responses:
        '200':
          description: Cancellation was immediate or had already been acknowledged.
          headers:
            Location:
              $ref: '#/components/headers/RunLocation'
            ETag:
              $ref: '#/components/headers/RunEtag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '202':
          description: Cancellation was durably requested and worker termination is pending.
          headers:
            Location:
              $ref: '#/components/headers/RunLocation'
            ETag:
              $ref: '#/components/headers/RunEtag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LifecycleConflict'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/runs/{runId}/events:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: streamRunEvents
      summary: Stream durable low-volume run events
      x-kaas-implementation-status: PROPOSED
      description: >-
        Authentication and run authorization are re-evaluated for every connection. Last-Event-ID is the decimal
        per-run sequence last processed by the client; replay starts strictly after it. Heartbeats are comment frames
        with no id. A retained terminal event is delivered before the server closes the stream. Query-string access
        tokens are forbidden.
      parameters:
        - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          description: >-
            SSE frames whose event field is a RunLiveEvent eventType, id field is its decimal sequence, and data field
            is one JSON RunLiveEvent. The stream has bounded retention and connection duration.
          content:
            text/event-stream:
              schema:
                type: string
                description: Serialized SSE frames validated from RunLiveEvent objects.
              examples:
                stateChange:
                  summary: One serialized durable event
                  value: |-
                    id: 1
                    event: RUN_STATE_CHANGED
                    data: {"schemaVersion":"1.0","eventId":"16161616-1616-4616-8616-161616161616","runId":"33333333-3333-4333-8333-333333333333","runVersion":3,"sequence":1,"occurredAt":"2026-08-27T18:00:00Z","eventType":"RUN_STATE_CHANGED","payload":{"previousState":"CREATED","state":"QUEUED","cancellationStatus":"NOT_REQUESTED"}}
        '204':
          description: The supplied cursor is already beyond the retained terminal event; the client must not reconnect.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/EventHistoryGap'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/runs/{runId}/results:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: getRunResults
      summary: Get canonical structured results and control-plane quality evaluation
      x-kaas-implementation-status: PROPOSED
      responses:
        '200':
          description: Accepted execution evidence plus separately evaluated quality-gate status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResults'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResultNotReady'
  /api/v1/runs/{runId}/artifacts:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: listRunArtifacts
      summary: List verified artifact metadata
      x-kaas-implementation-status: PROPOSED
      description: Returns metadata only. Authorized, expiring download capabilities are minted separately and never supplied by the runner.
      responses:
        '200':
          description: Verified artifacts; the list may be empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunArtifacts'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: API-client authentication; the token is never accepted in a query string.
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FeatureId:
      name: featureId
      in: path
      required: true
      schema: {type: string, format: uuid}
    EnvironmentId:
      name: environmentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RunProfileId:
      name: runProfileId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SecretReferenceId:
      name: secretReferenceId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Page:
      name: page
      in: query
      required: false
      schema: {type: integer, minimum: 0, default: 0}
    Size:
      name: size
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque client key scoped to authenticated organization, principal, operation, and target resource path. Implemented creation keys currently have no expiry.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._~-]+$'
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Untrusted decimal sequence last processed; replay resumes strictly after it.
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,15}$'
  headers:
    ResourceLocation:
      description: Canonical created resource path.
      schema: {type: string, maxLength: 512}
    IdempotencyReplayed:
      description: Whether this response replays an earlier committed success.
      schema: {type: string, enum: ['true', 'false']}
    CacheControlNoStore:
      description: Tenant-sensitive configuration metadata must not be stored by shared or private caches.
      schema: {type: string, const: no-store}
    RunLocation:
      description: Canonical run resource.
      schema:
        type: string
        pattern: '^/api/v1/runs/[0-9a-fA-F-]{36}$'
    RunEtag:
      description: >-
        Strong representation tag derived from the semantic runVersion. A CREATED run is "run-1"; the CREATED to
        QUEUED scheduling transition makes it "run-2". Because scheduling has no production trigger yet, "run-1" is
        currently the only tag a deployed API returns.
      schema:
        type: string
    RetryAfter:
      description: Seconds before retrying a rate-limited request.
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: JSON syntax, duplicate keys, or request encoding is invalid.
      headers:
        Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetail'}
    Unauthorized:
      description: Authentication is missing or invalid.
      headers:
        WWW-Authenticate:
          description: Bearer authentication challenge.
          schema: {type: string, const: Bearer}
        Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: The authenticated principal is not allowed to perform the operation. Deployments may use 404 to avoid existence disclosure.
      headers:
        Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: The authorized resource does not exist, or existence is intentionally concealed.
      headers:
        Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    IdempotencyConflict:
      description: The scoped key was already used with a different normalized request fingerprint.
      headers:
        Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: Idempotency or database uniqueness conflict.
      headers:
        Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetail'}
    LifecycleConflict:
      description: The requested lifecycle operation lost a race, is invalid from the current state, or the run is already terminal.
      headers:
        Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ResultNotReady:
      description: Canonical result processing has not completed.
      headers:
        Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    EventHistoryGap:
      description: The Last-Event-ID predates retained history. The problem extensions provide earliestSequence and latestSequence; refetch run/results/artifacts.
      headers:
        Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/EventHistoryGapProblem'
    ValidationProblem:
      description: Request validation failed. Submitted values are never echoed.
      headers:
        Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    PayloadTooLarge:
      description: The encoded or decoded request exceeds the contractual size limit.
      headers:
        Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    RateLimited:
      description: Principal, organization, project, or concurrency quota was exceeded.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
      additionalProperties: false
    Project:
      type: object
      required: [projectId, name, version, createdBy, createdAt, updatedBy, updatedAt]
      properties:
        projectId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 120}
        version: {type: integer, minimum: 0}
        createdBy: {type: string, minLength: 1, maxLength: 255}
        createdAt: {type: string, format: date-time}
        updatedBy: {type: string, minLength: 1, maxLength: 255}
        updatedAt: {type: string, format: date-time}
      additionalProperties: false
    ProjectPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/Project'}
    CreateFeatureRequest:
      type: object
      required: [name, logicalPath, source]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        logicalPath:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '^(?!/)(?!.*//)(?!.*(?:^|/)\.{1,2}(?:/|$))(?!.*\\)[A-Za-z0-9._~ -]+(?:/[A-Za-z0-9._~ -]+)*\.feature$'
        source:
          type: string
          minLength: 1
          description: Opaque source, at most 524288 UTF-8 bytes after JSON decoding. NUL and disallowed C0 controls are rejected; no newline or Unicode normalization occurs.
      additionalProperties: false
    Feature:
      type: object
      required: [featureId, projectId, name, logicalPath, createdBy, createdAt]
      properties:
        featureId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 160}
        logicalPath: {type: string, minLength: 1, maxLength: 512}
        createdBy: {type: string, minLength: 1, maxLength: 255}
        createdAt: {type: string, format: date-time}
      additionalProperties: false
    CreatedFeature:
      type: object
      required: [feature, initialRevision]
      properties:
        feature: {$ref: '#/components/schemas/Feature'}
        initialRevision: {$ref: '#/components/schemas/FeatureRevision'}
      additionalProperties: false
    FeaturePage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/Feature'}
    CreateFeatureRevisionRequest:
      type: object
      required: [source]
      properties:
        source:
          type: string
          minLength: 1
          description: Exact opaque source, limited to 524288 UTF-8 bytes after decoding.
      additionalProperties: false
    FeatureRevision:
      type: object
      required: [revisionId, featureId, projectId, revisionNumber, source, sourceDigest, createdBy, createdAt]
      properties:
        revisionId: {type: string, format: uuid}
        featureId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        revisionNumber: {type: integer, minimum: 1}
        source: {type: string, minLength: 1}
        sourceDigest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
          description: SHA-256 of the exact stored source encoded as UTF-8.
        createdBy: {type: string, minLength: 1, maxLength: 255}
        createdAt: {type: string, format: date-time}
      additionalProperties: false
    FeatureRevisionSummary:
      type: object
      required: [revisionId, featureId, revisionNumber, sourceDigest, createdBy, createdAt]
      properties:
        revisionId: {type: string, format: uuid}
        featureId: {type: string, format: uuid}
        revisionNumber: {type: integer, minimum: 1}
        sourceDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        createdBy: {type: string, minLength: 1, maxLength: 255}
        createdAt: {type: string, format: date-time}
      additionalProperties: false
    FeatureRevisionPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/FeatureRevisionSummary'}
    CreateSecretReferenceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9._-]{0,127}$'
          description: Portable logical name only; it cannot contain a provider path or URI.
      additionalProperties: false
    SecretReference:
      type: object
      description: Logical metadata only. This UUID is not a capability and no secret value or provider location is stored or redeemable.
      required: [secretReferenceId, projectId, name, createdBy, createdAt]
      properties:
        secretReferenceId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        name: {type: string, pattern: '^[A-Za-z][A-Za-z0-9._-]{0,127}$'}
        createdBy: {type: string, minLength: 1, maxLength: 255}
        createdAt: {type: string, format: date-time}
      additionalProperties: false
    SecretReferencePage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/SecretReference'}
    ConfigurationVariable:
      oneOf:
        - $ref: '#/components/schemas/StringConfigurationVariable'
        - $ref: '#/components/schemas/IntegerConfigurationVariable'
        - $ref: '#/components/schemas/BooleanConfigurationVariable'
      discriminator:
        propertyName: type
        mapping:
          STRING: '#/components/schemas/StringConfigurationVariable'
          INTEGER: '#/components/schemas/IntegerConfigurationVariable'
          BOOLEAN: '#/components/schemas/BooleanConfigurationVariable'
    StringConfigurationVariable:
      type: object
      required: [key, type, value]
      properties:
        key: {$ref: '#/components/schemas/ConfigurationKey'}
        type: {const: STRING}
        value:
          type: string
          description: Exact control-free, well-formed Unicode; at most 4096 UTF-8 bytes with no normalization.
      additionalProperties: false
    IntegerConfigurationVariable:
      type: object
      required: [key, type, value]
      properties:
        key: {$ref: '#/components/schemas/ConfigurationKey'}
        type: {const: INTEGER}
        value:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
      additionalProperties: false
    BooleanConfigurationVariable:
      type: object
      required: [key, type, value]
      properties:
        key: {$ref: '#/components/schemas/ConfigurationKey'}
        type: {const: BOOLEAN}
        value: {type: boolean}
      additionalProperties: false
    ConfigurationKey:
      type: string
      pattern: '^[A-Za-z_][A-Za-z0-9_.-]{0,127}$'
      description: Exact case-sensitive portable key; duplicate plain/secret keys in one revision are rejected.
    SecretBinding:
      type: object
      description: Binds a key to non-capability SecretReference metadata. It contains no secret value.
      required: [key, secretReferenceId]
      properties:
        key: {$ref: '#/components/schemas/ConfigurationKey'}
        secretReferenceId: {type: string, format: uuid}
      additionalProperties: false
    CreateEnvironmentRequest:
      type: object
      required: [name, variables, secretBindings]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        variables:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/ConfigurationVariable'}
        secretBindings:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/SecretBinding'}
      additionalProperties: false
    CreateEnvironmentRevisionRequest:
      type: object
      required: [variables, secretBindings]
      properties:
        variables:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/ConfigurationVariable'}
        secretBindings:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/SecretBinding'}
      additionalProperties: false
    Environment:
      type: object
      required: [environmentId, projectId, name, createdBy, createdAt]
      properties:
        environmentId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 128}
        createdBy: {type: string, minLength: 1, maxLength: 255}
        createdAt: {type: string, format: date-time}
      additionalProperties: false
    CreatedEnvironment:
      type: object
      required: [environment, initialRevision]
      properties:
        environment: {$ref: '#/components/schemas/Environment'}
        initialRevision: {$ref: '#/components/schemas/EnvironmentRevision'}
      additionalProperties: false
    EnvironmentRevision:
      type: object
      required: [revisionId, environmentId, projectId, revisionNumber, variables, secretBindings, contentDigest, createdBy, createdAt]
      properties:
        revisionId: {type: string, format: uuid}
        environmentId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        revisionNumber: {type: integer, minimum: 1}
        variables:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/ConfigurationVariable'}
        secretBindings:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/SecretBinding'}
        contentDigest: {$ref: '#/components/schemas/Sha256Digest'}
        createdBy: {type: string, minLength: 1, maxLength: 255}
        createdAt: {type: string, format: date-time}
      additionalProperties: false
    EnvironmentRevisionSummary:
      type: object
      required: [revisionId, environmentId, revisionNumber, contentDigest, createdBy, createdAt]
      properties:
        revisionId: {type: string, format: uuid}
        environmentId: {type: string, format: uuid}
        revisionNumber: {type: integer, minimum: 1}
        contentDigest: {$ref: '#/components/schemas/Sha256Digest'}
        createdBy: {type: string, minLength: 1, maxLength: 255}
        createdAt: {type: string, format: date-time}
      additionalProperties: false
    EnvironmentPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/Environment'}
    EnvironmentRevisionPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/EnvironmentRevisionSummary'}
    CreateRunProfileRequest:
      type: object
      required: [name, environmentRevisionId, selection, parallelism, scenarioRetry, executionTimeoutSeconds, artifactPolicy, configurationOverrides]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        environmentRevisionId: {type: string, format: uuid}
        selection: {$ref: '#/components/schemas/ProfileSelection'}
        parallelism: {type: integer, minimum: 1, maximum: 32}
        scenarioRetry: {$ref: '#/components/schemas/ScenarioRetry'}
        executionTimeoutSeconds: {type: integer, minimum: 1, maximum: 3600}
        artifactPolicy: {$ref: '#/components/schemas/ArtifactPolicy'}
        configurationOverrides:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/ConfigurationVariable'}
      additionalProperties: false
    CreateRunProfileRevisionRequest:
      type: object
      required: [environmentRevisionId, selection, parallelism, scenarioRetry, executionTimeoutSeconds, artifactPolicy, configurationOverrides]
      properties:
        environmentRevisionId: {type: string, format: uuid}
        selection: {$ref: '#/components/schemas/ProfileSelection'}
        parallelism: {type: integer, minimum: 1, maximum: 32}
        scenarioRetry: {$ref: '#/components/schemas/ScenarioRetry'}
        executionTimeoutSeconds: {type: integer, minimum: 1, maximum: 3600}
        artifactPolicy: {$ref: '#/components/schemas/ArtifactPolicy'}
        configurationOverrides:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/ConfigurationVariable'}
      additionalProperties: false
    ProfileSelection:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          maxItems: 100
          uniqueItems: true
          items: {type: string, pattern: '^@[A-Za-z0-9_.:-]{1,127}$'}
      additionalProperties: false
    RunProfile:
      type: object
      required: [runProfileId, projectId, name, createdBy, createdAt]
      properties:
        runProfileId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 128}
        createdBy: {type: string, minLength: 1, maxLength: 255}
        createdAt: {type: string, format: date-time}
      additionalProperties: false
    CreatedRunProfile:
      type: object
      required: [runProfile, initialRevision]
      properties:
        runProfile: {$ref: '#/components/schemas/RunProfile'}
        initialRevision: {$ref: '#/components/schemas/RunProfileRevision'}
      additionalProperties: false
    RunProfileRevision:
      type: object
      required: [revisionId, runProfileId, projectId, revisionNumber, environmentRevisionId, selection, parallelism, scenarioRetry, executionTimeoutSeconds, artifactPolicy, configurationOverrides, contentDigest, createdBy, createdAt]
      properties:
        revisionId: {type: string, format: uuid}
        runProfileId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        revisionNumber: {type: integer, minimum: 1}
        environmentRevisionId:
          type: string
          format: uuid
          description: Exact immutable EnvironmentRevision pinned by this profile revision.
        selection: {$ref: '#/components/schemas/ProfileSelection'}
        parallelism: {type: integer, minimum: 1, maximum: 32}
        scenarioRetry: {$ref: '#/components/schemas/ScenarioRetry'}
        executionTimeoutSeconds: {type: integer, minimum: 1, maximum: 3600}
        artifactPolicy: {$ref: '#/components/schemas/ArtifactPolicy'}
        configurationOverrides:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/ConfigurationVariable'}
        contentDigest: {$ref: '#/components/schemas/Sha256Digest'}
        createdBy: {type: string, minLength: 1, maxLength: 255}
        createdAt: {type: string, format: date-time}
      additionalProperties: false
    RunProfileRevisionSummary:
      type: object
      required: [revisionId, runProfileId, revisionNumber, environmentRevisionId, contentDigest, createdBy, createdAt]
      properties:
        revisionId: {type: string, format: uuid}
        runProfileId: {type: string, format: uuid}
        revisionNumber: {type: integer, minimum: 1}
        environmentRevisionId: {type: string, format: uuid}
        contentDigest: {$ref: '#/components/schemas/Sha256Digest'}
        createdBy: {type: string, minLength: 1, maxLength: 255}
        createdAt: {type: string, format: date-time}
      additionalProperties: false
    RunProfilePage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/RunProfile'}
    RunProfileRevisionPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/RunProfileRevisionSummary'}
    Sha256Digest:
      type: string
      pattern: '^sha256:[a-f0-9]{64}$'
      description: Server-computed digest of the documented versioned canonical content representation.
    PageMetadata:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        totalElements: {type: integer, minimum: 0}
        totalPages: {type: integer, minimum: 0}
      additionalProperties: true
    CreateRunRequest:
      type: object
      description: >-
        IMPLEMENTED profile-based run intent. The immutable RunProfileRevision supplies its pinned EnvironmentRevision
        and all execution settings. Client order is non-semantic; duplicate revision IDs are rejected.
      required: [featureRevisionIds, runProfileRevisionId]
      properties:
        featureRevisionIds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            format: uuid
        runProfileRevisionId:
          type: string
          format: uuid
      additionalProperties: false
    CancellationRequest:
      type: object
      required: [reason]
      properties:
        reason:
          const: USER_REQUESTED
      additionalProperties: false
    ScenarioRetry:
      type: object
      required: [maxAttempts, delayMilliseconds]
      properties:
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 5
        delayMilliseconds:
          type: integer
          minimum: 0
          maximum: 30000
      additionalProperties: false
      description: Karate scenario retry inside one execution attempt; never an orchestration retry.
    ArtifactPolicy:
      type: object
      required: [types, maxArtifactBytes, maxTotalBytes]
      properties:
        types:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            enum: [KARATE_HTML_REPORT, RAW_RESULT, EXECUTION_LOG, OTHER]
        maxArtifactBytes:
          type: integer
          minimum: 0
          maximum: 104857600
        maxTotalBytes:
          type: integer
          minimum: 0
          maximum: 524288000
      additionalProperties: false
    Run:
      type: object
      description: >-
        Current public TestRun aggregate. Create returns runVersion 1 in CREATED with null queue timing. The
        internal scheduler implements the single CREATED to QUEUED transition, which yields runVersion 2 with
        server-owned queue timing. Clients never supply queue timing, and the execution attempt that scheduling
        creates is deliberately withheld from this public representation because it is infrastructure history.
        NOTE: no production trigger invokes the scheduler yet, so a deployed run currently stays CREATED at
        runVersion 1 indefinitely. Do not poll for QUEUED until an outbox relay or scheduling trigger ships.
      required: [runId, projectId, runVersion, lifecycleState, cancellationStatus, testOutcome, infrastructureOutcome, qualityGateStatus, snapshotDigest, queueStartedAt, queueDeadlineAt, createdBy, createdAt, updatedAt]
      properties:
        runId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        runVersion:
          type: integer
          minimum: 1
        lifecycleState:
          enum: [CREATED, QUEUED, CLAIMED, PROVISIONING, RUNNING, COLLECTING_RESULTS, PROCESSING_RESULTS, STOPPING, COMPLETED]
        cancellationStatus:
          enum: [NOT_REQUESTED, REQUESTED, ACKNOWLEDGED]
        testOutcome:
          type: [string, 'null']
          enum: [PASSED, FAILED, NOT_AVAILABLE, null]
        infrastructureOutcome:
          type: [string, 'null']
          enum: [SUCCEEDED, FAILED, TIMED_OUT, CANCELLED, null]
        qualityGateStatus:
          enum: [NOT_EVALUATED, PASSED, FAILED]
        snapshotDigest:
          $ref: '#/components/schemas/Sha256Digest'
        queueStartedAt:
          type: [string, 'null']
          format: date-time
          description: Server-owned instant the run entered QUEUED. Null in CREATED.
        queueDeadlineAt:
          type: [string, 'null']
          format: date-time
          description: >-
            Server-owned queue expiry, computed as queueStartedAt plus the configured queue timeout. Null in
            CREATED; queue timing never starts before the run is QUEUED.
        createdBy:
          type: string
          minLength: 1
          maxLength: 255
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    RunPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/Run'}
    RunSnapshot:
      type: object
      required: [runId, projectId, snapshotVersion, features, environment, runProfile, effectiveConfiguration, secretBindings, selection, parallelism, scenarioRetry, executionTimeoutSeconds, artifactPolicy, engine, snapshotDigest]
      properties:
        runId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        snapshotVersion: {type: integer, const: 1}
        features:
          type: array
          minItems: 1
          maxItems: 1000
          items: {$ref: '#/components/schemas/SnapshotFeature'}
        environment: {$ref: '#/components/schemas/SnapshotRevision'}
        runProfile: {$ref: '#/components/schemas/SnapshotRevision'}
        effectiveConfiguration:
          type: array
          maxItems: 500
          items: {$ref: '#/components/schemas/ConfigurationVariable'}
        secretBindings:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/SecretBinding'}
        selection: {$ref: '#/components/schemas/ProfileSelection'}
        parallelism: {type: integer, minimum: 1, maximum: 32}
        scenarioRetry: {$ref: '#/components/schemas/ScenarioRetry'}
        executionTimeoutSeconds: {type: integer, minimum: 1, maximum: 3600}
        artifactPolicy: {$ref: '#/components/schemas/ArtifactPolicy'}
        engine: {$ref: '#/components/schemas/EngineDescriptor'}
        snapshotDigest: {$ref: '#/components/schemas/Sha256Digest'}
      additionalProperties: false
    SnapshotFeature:
      type: object
      required: [featureId, revisionId, revisionNumber, logicalPath, sourceDigest]
      properties:
        featureId: {type: string, format: uuid}
        revisionId: {type: string, format: uuid}
        revisionNumber: {type: integer, minimum: 1}
        logicalPath: {type: string, minLength: 1, maxLength: 512}
        sourceDigest: {$ref: '#/components/schemas/Sha256Digest'}
      additionalProperties: false
    SnapshotRevision:
      type: object
      required: [resourceId, revisionId, revisionNumber, contentDigest]
      properties:
        resourceId: {type: string, format: uuid}
        revisionId: {type: string, format: uuid}
        revisionNumber: {type: integer, minimum: 1}
        contentDigest: {$ref: '#/components/schemas/Sha256Digest'}
      additionalProperties: false
    EngineDescriptor:
      type: object
      required: [engine, version]
      properties:
        engine: {type: string, const: KARATE}
        version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$'
      additionalProperties: false
    QualityGateEvaluation:
      type: object
      required: [status, evaluationVersion, checks]
      properties:
        status:
          enum: [PASSED, FAILED, NOT_EVALUATED]
        evaluationVersion:
          type: integer
          minimum: 1
        evaluatedAt:
          type: [string, 'null']
          format: date-time
        policyVersion:
          type: [string, 'null']
          maxLength: 128
        checks:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/QualityGateCheck'
      additionalProperties: false
    QualityGateCheck:
      type: object
      required: [name, actual, operator, expected, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        actual:
          oneOf:
            - type: number
            - type: boolean
        operator:
          enum: [EQ, NE, LT, LTE, GT, GTE]
        expected:
          oneOf:
            - type: number
            - type: boolean
        status:
          enum: [PASSED, FAILED]
      additionalProperties: false
    RunResults:
      type: object
      required: [executionResult, qualityGate]
      properties:
        executionResult:
          $ref: '../../packages/api-contracts/runner-result.schema.json'
        qualityGate:
          $ref: '#/components/schemas/QualityGateEvaluation'
      additionalProperties: false
    RunArtifacts:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Artifact'
      additionalProperties: false
    Artifact:
      type: object
      required: [artifactId, type, contentType, sizeBytes, sha256, createdAt]
      properties:
        artifactId:
          type: string
          format: uuid
        type:
          enum: [KARATE_HTML_REPORT, RAW_RESULT, EXECUTION_LOG, OTHER]
        contentType:
          type: string
          maxLength: 255
        sizeBytes:
          type: integer
          minimum: 0
          maximum: 104857600
        sha256:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
      description: Verified metadata only. HTML and OTHER remain untrusted download-only content unless separately sanitized and isolated.
    ProblemDetail:
      type: object
      required: [type, title, status, code, detail, instance, requestId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          maxLength: 128
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          enum: [UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, VALIDATION_FAILED, IDEMPOTENCY_CONFLICT, PROJECT_NAME_CONFLICT, FEATURE_PATH_CONFLICT, SECRET_REFERENCE_NAME_CONFLICT, ENVIRONMENT_NAME_CONFLICT, RUN_PROFILE_NAME_CONFLICT, CONFLICT, LIFECYCLE_CONFLICT, RESULT_NOT_READY, UNSUPPORTED_OPERATION, PAYLOAD_TOO_LARGE, RATE_LIMITED, EVENT_HISTORY_GAP, INTERNAL_ERROR]
        detail:
          type: string
          maxLength: 2048
        instance:
          type: string
          format: uri-reference
        requestId:
          type: string
          minLength: 1
          maxLength: 128
      additionalProperties: true
      description: RFC 9457-style problem details. Extensions must never expose submitted values, secrets, stack traces, host paths, or concealed tenant identity.
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              maxItems: 100
              items:
                type: object
                required: [pointer, message]
                properties:
                  pointer:
                    type: string
                    pattern: '^(/([^/~]|~[01])*)*$'
                    maxLength: 512
                  message:
                    type: string
                    maxLength: 512
                additionalProperties: false
    EventHistoryGapProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          required: [earliestSequence, latestSequence, resync]
          properties:
            earliestSequence:
              type: integer
              minimum: 1
            latestSequence:
              type: integer
              minimum: 1
            resync:
              type: string
              pattern: '^/api/v1/runs/[0-9a-fA-F-]{36}$'
