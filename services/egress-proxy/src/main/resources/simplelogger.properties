# The proxy's only logging binding exists for dnsjava, which logs through SLF4J. Its levels are pinned here
# rather than left to slf4j-simple's defaults (KAAS-22).
#
# What dnsjava can log at DEBUG and TRACE is every name it resolves and every message it exchanges. A name is
# chosen by tenant code, and hostile tenant code can put anything in a name -- including a value it was given
# to use. Structural non-logging is the rule for this component: nothing a request carries is written anywhere,
# so the resolver is held to ERROR, where it reports its own failures and nothing it was asked.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.log.org.xbill.DNS=error
org.slf4j.simpleLogger.showDateTime=false
