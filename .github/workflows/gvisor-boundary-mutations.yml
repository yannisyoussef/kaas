# THE MUTATION BATTERY FOR THE PROPERTIES ONLY GVISOR CAN SHOW.
#
# Most of KAAS-19's mutations are killed by the ordinary suites: the frame, the refusals, the contract, the
# structural rules. Four are not, and cannot be, because what they break is a filesystem property that no
# machine without runsc can observe — the freeze itself, the flags it sets, and the capability drop.
#
# So they run here, against real gVisor, without Gradle: each one patches the source, rebuilds the small probe
# image, runs one container, and reads what the sandbox reported. That is seconds per mutation instead of a
# full gate run, which is what makes measuring them at all practical.
#
# Manual-ish by design: it is not one of the eight required checks and gates nothing. Its output is evidence
# for the slice report, and it is expected to be deleted once that report records the result.
name: gvisor-boundary-mutations

on:
  push:
    paths:
      - .github/workflows/gvisor-boundary-mutations.yml

permissions:
  contents: read

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install the pinned mediating runtime
        env:
          GVISOR_RELEASE: "20260817"
          RUNSC_SHA256: "048b89aada69dc3333422e139d6e9d02f8ab06bda52398060e0fbdacca00074c"
        run: |
          set -euo pipefail
          url="https://storage.googleapis.com/gvisor/releases/release/${GVISOR_RELEASE}/$(uname -m)"
          curl -fsSL "${url}/runsc" -o /tmp/runsc
          echo "${RUNSC_SHA256}  /tmp/runsc" | sha256sum -c -
          sudo install -o root -g root -m 0755 /tmp/runsc /usr/local/bin/runsc
          sudo mkdir -p /etc/docker
          echo '{"runtimes":{"runsc":{"path":"/usr/local/bin/runsc"}}}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker
          for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 1; done
          docker info --format '{{range $k,$v := .Runtimes}}{{$k}} {{end}}'

      - name: Frame a bundle
        run: |
          python3 - <<'PY'
          import hashlib, struct
          entries = [("features/a.feature", b"Feature: a\n")]
          out = bytearray(b"KAASSRC1") + hashlib.sha256(b"mutation").hexdigest().encode()
          out += struct.pack(">I", len(entries))
          for path, content in entries:
              p = path.encode()
              out += struct.pack(">I", len(p)) + p
              out += hashlib.sha256(content).hexdigest().encode()
              out += struct.pack(">Q", len(content)) + content
          out += b"KAASEND1"
          open("/tmp/bundle.frame", "wb").write(out)
          PY

      # THE HARNESS, held to the same rule as every other one in this repository: it is untrusted until it has
      # been shown to distinguish the three outcomes. Every mutation asserts that its anchor existed exactly
      # once, that the file on disk actually changed, that the image was rebuilt from the changed source, and
      # that the verdict came from parsed observations rather than from a grep over build chatter. The tree is
      # restored whatever happens.
      - name: Run the boundary mutations
        run: |
          set -uo pipefail
          probe=services/runner/src/main/docker/probe

          observe() {
            docker build -q -t kaas-mut:local "$probe" >/dev/null 2>&1 || { echo "BUILD_REFUSED"; return; }
            docker run --rm -i --runtime=runsc --network=none --user 0:0 \
              --cap-drop=ALL --cap-add=SYS_ADMIN --cap-add=SETUID --cap-add=SETGID --cap-add=SETPCAP \
              --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
              --tmpfs /kaas/source:rw,noexec,nosuid,nodev,size=8m \
              --entrypoint "$1" kaas-mut:local "$2" < /tmp/bundle.frame 2>&1
          }

          verdict() { # id, expectation-description, grep pattern that must be ABSENT for a kill
            local id="$1" want="$2" pattern="$3" out="$4"
            if echo "$out" | grep -qE "$pattern"; then
              echo "$id SURVIVED   (still reported: $want)"
              echo "$id" >> /tmp/survivors
            else
              echo "$id KILLED     ($want is gone)"
              echo "$out" | grep -E 'bootstrap_|source_mount_|final_consumer|workload_outcome' | sed 's/^/      /' | head -8
            fi
          }

          mutate() { # id, file, old, new
            local id="$1" file="$2" old="$3" new="$4"
            local count
            count=$(python3 - "$file" "$old" <<'PY'
          import sys
          print(open(sys.argv[1]).read().count(sys.argv[2]))
          PY
          )
            if [ "$count" != "1" ]; then
              echo "$id HARNESS_FAILURE anchor appears $count times"
              return 1
            fi
            python3 - "$file" "$old" "$new" <<'PY'
          import sys
          path, old, new = sys.argv[1], sys.argv[2], sys.argv[3]
          s = open(path).read()
          open(path, 'w').write(s.replace(old, new, 1))
          PY
            git diff --quiet -- "$file" && { echo "$id HARNESS_FAILURE edit did not apply"; return 1; }
            return 0
          }

          : > /tmp/survivors

          echo "===== BASELINE, so every kill below is a change from something that worked"
          base=$(observe /source-bootstrap sourceverify)
          echo "$base" | grep -E 'bootstrap_|source_mount_(ro|noexec|nosuid|nodev)|final_consumer|workload_outcome'
          echo "$base" | grep -q '^workload_outcome=PASSED$' || { echo "BASELINE BROKEN — nothing below means anything"; exit 1; }

          echo
          echo "===== F01  the freeze stops asking for read-only"
          if mutate F01 "$probe/source-bootstrap.c" \
              "MS_REMOUNT | MS_RDONLY | MS_NOEXEC | MS_NOSUID | MS_NODEV" \
              "MS_REMOUNT | MS_NOEXEC | MS_NOSUID | MS_NODEV"; then
            verdict F01 "source_mount_ro=true" '^source_mount_ro=true$' "$(observe /source-bootstrap sourceverify)"
          fi
          git checkout -- "$probe"

          echo
          echo "===== F02  the freeze stops asking for noexec"
          if mutate F02 "$probe/source-bootstrap.c" \
              "MS_REMOUNT | MS_RDONLY | MS_NOEXEC | MS_NOSUID | MS_NODEV" \
              "MS_REMOUNT | MS_RDONLY | MS_NOSUID | MS_NODEV"; then
            verdict F02 "source_mount_noexec=true" '^source_mount_noexec=true$' "$(observe /source-bootstrap sourceverify)"
          fi
          git checkout -- "$probe"

          echo
          echo "===== F09  the filesystem is never frozen at all"
          if mutate F09 "$probe/source-bootstrap.c" \
              'if (mount("none", SOURCE_ROOT, NULL,' \
              'if (0 && mount("none", SOURCE_ROOT, NULL,'; then
            verdict F09 "workload_outcome=PASSED" '^workload_outcome=PASSED$' "$(observe /source-bootstrap sourceverify)"
          fi
          git checkout -- "$probe"

          echo
          echo "===== F10  the construction capability survives into the consumer"
          if mutate F10 "$probe/source-bootstrap.c" \
              "    drop_all_privilege();" \
              "    if (0) { drop_all_privilege(); }"; then
            verdict F10 "final_consumer_capabilities=EMPTY" '^final_consumer_capabilities=EMPTY$' "$(observe /source-bootstrap sourceverify)"
          fi
          git checkout -- "$probe"

          echo
          echo "===== F16  the mount parser reports noexec without reading the mount"
          if mutate F16 "$probe/probe.sh" \
              'emit source_mount_noexec "$(case ",${mountline}," in *,noexec,*) echo true;; *) echo false;; esac)"' \
              'emit source_mount_noexec true'; then
            # This one must SURVIVE the ordinary verifier and be caught by the boundary comparison instead:
            # a hardcoded flag is invisible to anything that only reads the flag. Reported either way.
            out=$(observe /source-boundary-fixture sourceboundary)
            echo "$out" | grep -E 'exec_control|exec_hardened|source_mount_noexec' | sed 's/^/      /'
            echo "F16 NOTE the flag can be faked; exec_control/exec_hardened is what cannot be"
          fi
          git checkout -- "$probe"

          echo
          echo "===== F05  the executable control fixture is made non-executable"
          #
          # The mode is set twice on purpose -- once at creation and once after closing, because a creation
          # mode is filtered through the umask -- so a mutation that changes only one of them changes nothing.
          # A first attempt did exactly that and the control kept running; the fixture's chmod is what this
          # has to break, and getting that wrong is how a mutation reports a survivor that is really a
          # mistake in the mutation.
          if mutate F05 "$probe/source-boundary-fixture.c" \
              "    chmod(path, 0555);" \
              "    chmod(path, 0444);"; then
            out=$(observe /source-boundary-fixture sourceboundary)
            echo "$out" | grep -E 'exec_control|exec_hardened' | sed 's/^/      /'
            if echo "$out" | grep -q '^exec_control=EXECUTED$'; then
              echo "F05 SURVIVED   the control still ran, so the fixture mode is not what makes it run"
              echo F05 >> /tmp/survivors
            else
              echo "F05 KILLED     the control stopped running, which is what makes the hardened refusal meaningful"
            fi
          fi
          git checkout -- "$probe"

          echo
          echo "===== RESULT"
          git status --porcelain -- "$probe" | grep . && { echo "the tree was not restored"; exit 1; }
          echo "tree restored clean"
          if [ -s /tmp/survivors ]; then
            echo "survivors: $(tr '\n' ' ' < /tmp/survivors)"
          else
            echo "no survivors"
          fi

      - name: Clean up
        if: always()
        run: docker ps -aq | xargs -r docker rm -f
