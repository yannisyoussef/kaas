name: Release images

# Publishes one release of KaaS and hands it to Operations as a manifest of digests (KAAS-DEPLOY-001).
#
# GitHub owns build, test, image publication and the immutable digests. GitLab owns deployment orchestration and
# is NOT called from here: this repository holds no GitLab trigger, token or project, and guessing one would be
# guessing someone else's infrastructure. The handoff contract is the manifest artifact this workflow uploads --
# docs/deployment/image-promotion.md says exactly what Operations' side reads from it and verifies.
#
# Manual on purpose. A release is a decision, and it is made for a revision whose CI run is green; the job
# refuses a revision that is not the checked-out commit or a tree that is not clean.
on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Full commit sha to release (its CI run must be green)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The dispatch input is UNTRUSTED DATA. It is bound here, once, and reaches shell only as "$REVISION" -- never
    # as ${{ }} text inside a run: block, where a crafted value would become shell source before anything had
    # checked it. The first step refuses anything but a full lowercase commit sha.
    env:
      REVISION: ${{ inputs.revision }}
    steps:
      - name: Refuse anything but a full commit sha
        run: |
          set -euo pipefail
          if [[ ! "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "revision must be exactly 40 lowercase hexadecimal characters" >&2
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.REVISION }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/api-contracts/package-lock.json
      - run: npm ci
        working-directory: packages/api-contracts
      - name: Refuse a revision whose CI did not pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A successful ci.yml run for EXACTLY this commit: the API filters by head_sha, and the result is checked
          # again here, so a filter the API ignored could not widen it to "some successful run".
          # $ENV.REVISION is a jq variable, read by jq from the environment: it must NOT be expanded by the shell.
          # shellcheck disable=SC2016
          successes=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${REVISION}&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" and .head_sha == $ENV.REVISION)] | length')
          if [ "$successes" -lt 1 ]; then
            echo "No successful CI run exists for ${REVISION}." >&2
            exit 1
          fi
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build, push and verify
        run: |
          set -euo pipefail
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          infrastructure/release/build-release.sh "ghcr.io/${owner}" "$REVISION" release-manifest.json
          cat release-manifest.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: kaas-release-manifest-${{ env.REVISION }}
          path: release-manifest.json
          if-no-files-found: error
