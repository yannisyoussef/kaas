# A MEASUREMENT, NOT A GATE.
#
# KAAS-19 has to explain why a mediated source mount carries `ro` and drops `noexec`, `nosuid` and `nodev`
# before it changes any production code. macOS cannot register runsc, so that question can only be asked on a
# real Linux host with the pinned runtime — which is what this workflow exists to do.
#
# Manual dispatch only. It is not one of the eight required checks, it does not gate anything, and it is
# expected to be deleted once its answer is recorded in the architecture evaluation.
name: gvisor-filesystem-experiment

# Dispatch would be tidier, but a workflow only becomes dispatchable once it exists on the default branch,
# and this one is temporary. Scoped to its own path so iterating on the experiment runs it and pushing
# anything else does not.
on:
  push:
    paths:
      - .github/workflows/gvisor-filesystem-experiment.yml

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      # The same pin the strong-runtime gate uses. Measuring a different build would answer a question about
      # a runtime this repository does not run.
      - name: Install the pinned mediating runtime
        env:
          GVISOR_RELEASE: "20260817"
          RUNSC_SHA256: "048b89aada69dc3333422e139d6e9d02f8ab06bda52398060e0fbdacca00074c"
        run: |
          set -euo pipefail
          url="https://storage.googleapis.com/gvisor/releases/release/${GVISOR_RELEASE}/$(uname -m)"
          curl -fsSL "${url}/runsc" -o /tmp/runsc
          echo "${RUNSC_SHA256}  /tmp/runsc" | sha256sum -c -
          sudo install -o root -g root -m 0755 /tmp/runsc /usr/local/bin/runsc
          runsc --version
          sudo mkdir -p /etc/docker
          echo '{"runtimes":{"runsc":{"path":"/usr/local/bin/runsc"}}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 1; done
          docker info --format '{{range $k,$v := .Runtimes}}{{$k}} {{end}}'

      # FIXTURES THAT ACTUALLY WORK, built here rather than assumed.
      #
      # KAAS-15 proved a setuid claim with busybox `id`, which drops privileges on its own and would have
      # reported the same thing whether nosuid was enforced or not. So the escalation fixture is a static C
      # binary that prints its real and effective uid and nothing else, and every experiment below runs it on
      # a permissive filesystem first. A fixture that cannot escalate on the control proves nothing when it
      # fails on the hardened mount.
      - name: Build the executable and setuid fixtures
        run: |
          set -euo pipefail
          mkdir -p /tmp/fixtures
          cat > /tmp/whoami.c <<'C'
          #include <stdio.h>
          #include <unistd.h>
          int main(void) { printf("ruid=%d euid=%d\n", (int) getuid(), (int) geteuid()); return 0; }
          C
          gcc -static -O2 -o /tmp/fixtures/whoami /tmp/whoami.c
          printf '#!/bin/sh\necho SCRIPT_RAN\n' > /tmp/fixtures/script.sh
          chmod 0755 /tmp/fixtures/whoami /tmp/fixtures/script.sh
          # The setuid copy is owned by root with the bit set. On a suid-honouring filesystem a non-root
          # caller sees euid=0; under nosuid it sees its own uid. That difference is the whole measurement.
          sudo cp /tmp/fixtures/whoami /tmp/fixtures/whoami-suid
          sudo chown root:root /tmp/fixtures/whoami-suid
          sudo chmod 4755 /tmp/fixtures/whoami-suid
          ls -l /tmp/fixtures
          echo "--- host control (runner uid $(id -u)):"
          /tmp/fixtures/whoami
          /tmp/fixtures/whoami-suid

      - name: Stage a host directory the way the platform stages source
        run: |
          set -euo pipefail
          sudo rm -rf /tmp/kaas-exp && mkdir -p /tmp/kaas-exp/files
          cp /tmp/fixtures/whoami /tmp/fixtures/whoami-suid /tmp/fixtures/script.sh /tmp/kaas-exp/files/
          echo "inert bytes" > /tmp/kaas-exp/files/plain.txt
          sudo chown -R root:root /tmp/kaas-exp/files/whoami-suid
          sudo chmod 4755 /tmp/kaas-exp/files/whoami-suid
          chmod 0755 /tmp/kaas-exp /tmp/kaas-exp/files
          ls -l /tmp/kaas-exp/files

      # THE PROBE, written once and run against every candidate.
      #
      # It reports what the sandbox observes rather than what was requested, and it reports mountinfo's two
      # option namespaces separately -- per-mount flags and super-block options -- because a parser that reads
      # only one of them can call a mount hardened when it is not. That distinction is exactly what KAAS-19
      # has to get right, so the experiment models it from the start.
      - name: Write the observation probe
        run: |
          cat > /tmp/observe.sh <<'SH'
          #!/bin/sh
          target="${1:-/kaas/source}"
          echo "=== target=$target"
          echo "--- /proc/self/mounts"
          awk -v t="$target" '$2 == t {print}' /proc/self/mounts 2>/dev/null || echo "(absent)"
          echo "--- /proc/self/mountinfo (field 6 = per-mount flags; after '-' = fstype and super options)"
          awk -v t="$target" '$5 == t {print}' /proc/self/mountinfo 2>/dev/null || echo "(absent)"
          echo "--- identity"
          id 2>/dev/null || echo "(no id)"
          echo "--- capabilities"
          grep -E '^Cap(Inh|Prm|Eff|Bnd|Amb)' /proc/self/status 2>/dev/null || echo "(none reported)"
          echo "--- write"
          if echo probe > "$target/kaas-write-probe" 2>/dev/null; then
              echo "write=ACCEPTED"; rm -f "$target/kaas-write-probe" 2>/dev/null
          else
              echo "write=REFUSED"
          fi
          echo "--- exec (static binary)"
          if "$target/files/whoami" 2>&1; then echo "exec_binary=EXECUTED"; else echo "exec_binary=REFUSED"; fi
          echo "--- exec (shebang script)"
          if "$target/files/script.sh" 2>&1; then echo "exec_script=EXECUTED"; else echo "exec_script=REFUSED"; fi
          echo "--- setuid escalation"
          out=$("$target/files/whoami-suid" 2>&1 || echo "refused")
          echo "suid_output=$out"
          case "$out" in *"euid=0"*) echo "suid=ESCALATED";; *refused*) echo "suid=REFUSED_EXEC";; *) echo "suid=NOT_ESCALATED";; esac
          echo "--- modes as seen inside"
          ls -l "$target/files" 2>/dev/null || echo "(unlistable)"
          SH
          chmod +x /tmp/observe.sh

      # ROUND TWO — THE PROPOSED MECHANISM, MEASURED END TO END.
      #
      # Round one settled the shape of the answer. A gofer bind under gVisor carries `ro` alone, and a
      # shebang script on it executed. A sandbox-internal tmpfs honours noexec and nosuid. A populated tmpfs
      # can be remounted read-only from inside the sandbox with CAP_SYS_ADMIN — refused under runc, allowed
      # under gVisor, because the sentry implements mount itself and no host mount syscall is involved.
      #
      # What is still open, and what this round exists to answer:
      #   * does the freeze produce `nodev`? It was absent from round one's option list.
      #   * can the bootstrap drop every capability irreversibly, read back empty, and lose the remount?
      #   * does an executable fixture actually run on a permissive control filesystem in this sandbox, so
      #     that the same fixture being refused on the hardened one means something?
      #   * does a setuid fixture actually escalate on the control, so nosuid is not a vacuous pass?
      #   * what happens when a legal frame does not fit the filesystem it is being written into?
      - name: Build the bootstrap from the repository source
        run: |
          set -euo pipefail
          mkdir -p /tmp/build
          gcc -static -O2 -Wall -Wextra \
            -o /tmp/build/source-bootstrap \
            services/runner/src/main/docker/probe/source-bootstrap.c
          ls -l /tmp/build/source-bootstrap
          file /tmp/build/source-bootstrap || true

      - name: Frame a bundle the way the runner will
        run: |
          python3 - <<'PY'
          import hashlib, struct
          entries = [("features/a.feature", b"Feature: a\n"),
                     ("features/nested/b.feature", b"CRLF\r\nLF\ntab\there\n")]
          out = bytearray(b"KAASSRC1")
          out += hashlib.sha256(b"experiment").hexdigest().encode()
          out += struct.pack(">I", len(entries))
          for path, content in entries:
              p = path.encode()
              out += struct.pack(">I", len(p)) + p
              out += hashlib.sha256(content).hexdigest().encode()
              out += struct.pack(">Q", len(content)) + content
          out += b"KAASEND1"
          open("/tmp/bundle.frame", "wb").write(out)
          print("frame bytes:", len(out))
          # And an oversized one: sixteen 1 MiB entries into an 8 MiB filesystem. The frame is legal by every
          # bound the format declares and simply does not fit, which is the case a filesystem size limit has
          # to turn into a clean refusal rather than an unbounded write.
          big = [("features/f%d.feature" % i, b"x" * (1024 * 1024)) for i in range(16)]
          out = bytearray(b"KAASSRC1") + hashlib.sha256(b"big").hexdigest().encode() + struct.pack(">I", len(big))
          for path, content in big:
              p = path.encode()
              out += struct.pack(">I", len(p)) + p + hashlib.sha256(content).hexdigest().encode()
              out += struct.pack(">Q", len(content)) + content
          out += b"KAASEND1"
          open("/tmp/big.frame", "wb").write(out)
          print("oversized frame bytes:", len(out))
          PY

      - name: Write the boundary observer
        run: |
          cat > /tmp/boundary.sh <<'SH'
          #!/bin/sh
          # Runs as the unprivileged consumer, after the freeze and after the capability drop. Everything it
          # reports is read from the process it is actually running in.
          echo "=== FINAL CONSUMER"
          echo "identity: $(id 2>&1)"
          echo "--- mounts"
          awk '$2 ~ /^\/kaas/ {print}' /proc/self/mounts
          echo "--- mountinfo"
          awk '$5 ~ /^\/kaas/ {print}' /proc/self/mountinfo
          echo "--- capabilities and no-new-privs"
          grep -E '^(CapInh|CapPrm|CapEff|CapBnd|CapAmb|NoNewPrivs)' /proc/self/status
          echo "--- can the consumer remount the source writable?"
          if mount -o remount,rw /kaas/source 2>&1; then echo "reremount=OK <-- BAD"; else echo "reremount=REFUSED"; fi
          echo "--- write to the hardened filesystem"
          if echo x > /kaas/source/write-probe 2>&1; then echo "hardened_write=ACCEPTED <-- BAD"; else echo "hardened_write=REFUSED"; fi
          echo "--- CONTROL: an identical fixture on a permissive tmpfs"
          printf '#!/bin/sh\necho FIXTURE_RAN\n' > /kaas/control/fixture-exec.sh 2>/dev/null
          chmod 0555 /kaas/control/fixture-exec.sh 2>/dev/null
          if /kaas/control/fixture-exec.sh 2>&1; then echo "exec_control=EXECUTED"; else echo "exec_control=REFUSED <-- CONTROL BROKEN"; fi
          cp /fixtures/whoami-suid /kaas/control/fixture-suid 2>/dev/null
          out=$(/kaas/control/fixture-suid 2>&1 || echo refused)
          echo "suid_control_output=$out"
          case "$out" in *"euid=0"*) echo "suid_control=ESCALATED";; *) echo "suid_control=NOT_ESCALATED <-- CONTROL BROKEN";; esac
          echo "--- HARDENED: the same fixtures, with real modes, on the source filesystem"
          ls -l /kaas/source/files/ 2>&1
          if /kaas/source/files/fixture-exec.sh 2>&1; then echo "exec_hardened=EXECUTED <-- BAD"; else echo "exec_hardened=REFUSED"; fi
          out=$(/kaas/source/files/fixture-suid 2>&1 || echo refused)
          echo "suid_hardened_output=$out"
          case "$out" in *"euid=0"*) echo "suid_hardened=ESCALATED <-- BAD";; *) echo "suid_hardened=REFUSED";; esac
          echo "--- device node creation on the hardened filesystem"
          if mknod /kaas/source/files/dev-probe c 1 3 2>&1; then echo "mknod_hardened=CREATED <-- BAD"; else echo "mknod_hardened=REFUSED"; fi
          echo "--- device node on the control, to see whether the attempt can succeed at all here"
          if mknod /kaas/control/dev-probe c 1 3 2>&1; then echo "mknod_control=CREATED"; else echo "mknod_control=REFUSED"; fi
          echo "--- every mount this consumer can see"
          awk '{print $2, $3}' /proc/self/mounts | sort
          echo "--- bytes"
          cat /kaas/source/manifest.tsv 2>&1
          find /kaas/source/files -type f -exec sh -c 'echo "$1 $(sha256sum "$1" | cut -d" " -f1)"' _ {} \;
          SH
          chmod +x /tmp/boundary.sh

      # THE FIXTURES ARE PLANTED BY AN EXPERIMENT-ONLY SHELL, before the bootstrap freezes anything.
      #
      # Production has no such path and is not getting one: the bundle format carries a path and bytes and
      # cannot express a mode. The fixtures exist so that "noexec refused it" is distinguishable from "the
      # file was not executable", which is precisely the confusion KAAS-18 ended on.
      # ROUND THREE — WHICH PRIVILEGE THE CONSTRUCTION PHASE ACTUALLY NEEDS.
      #
      # Round two failed at PRIVILEGE_DROP: setgid and setuid need CAP_SETGID and CAP_SETUID, which the run
      # did not grant. There are two ways out and they are not equivalent.
      #
      #   Q asks for none of them: the launcher starts the process as the sandbox user already, so there is
      #     no identity transition to make and SYS_ADMIN is the only extra capability in play.
      #   R grants SETUID, SETGID and SETPCAP and starts as root, which is the shape that needs justifying.
      #
      # Q is the design worth having if it works, because it makes the construction phase differ from the
      # consumer in exactly one capability. Measuring both is what makes that a finding rather than a
      # preference.
      - name: Q — the sandbox user throughout, with SYS_ADMIN as the only extra capability
        run: |
          set -uo pipefail
          echo "##################### Q / runsc"
          docker run --rm -i --runtime=runsc --network=none \
            --user 65534:65534 \
            --cap-drop=ALL --cap-add=SYS_ADMIN \
            --tmpfs /kaas/source:rw,noexec,nosuid,nodev,size=8m,mode=0755,uid=65534,gid=65534 \
            --tmpfs /kaas/control:rw,exec,suid,dev,size=8m,mode=0777 \
            -v /tmp/build/source-bootstrap:/bootstrap:ro \
            -v /tmp/fixtures:/fixtures:ro \
            -v /tmp/boundary.sh:/probe.sh:ro \
            alpine:3.20 /bootstrap < /tmp/bundle.frame 2>&1 || echo "(container exited non-zero)"

      - name: Q2 — the same, with an executable and a setuid fixture on the hardened filesystem
        run: |
          set -uo pipefail
          echo "##################### Q2 / runsc"
          docker run --rm -i --runtime=runsc --network=none \
            --user 0:0 \
            --cap-drop=ALL --cap-add=SYS_ADMIN --cap-add=SETUID --cap-add=SETGID --cap-add=SETPCAP --cap-add=CHOWN --cap-add=FOWNER \
            --tmpfs /kaas/source:rw,noexec,nosuid,nodev,size=8m \
            --tmpfs /kaas/control:rw,exec,suid,dev,size=8m,mode=0777 \
            -v /tmp/build/source-bootstrap:/bootstrap:ro \
            -v /tmp/fixtures:/fixtures:ro \
            -v /tmp/boundary.sh:/probe.sh:ro \
            alpine:3.20 sh -c '
              mkdir -p /kaas/source/files
              printf "#!/bin/sh\necho FIXTURE_RAN\n" > /kaas/source/files/fixture-exec.sh
              chmod 0555 /kaas/source/files/fixture-exec.sh
              cp /fixtures/whoami-suid /kaas/source/files/fixture-suid
              chown 0:0 /kaas/source/files/fixture-suid
              chmod 4755 /kaas/source/files/fixture-suid
              exec /bootstrap' < /tmp/bundle.frame 2>&1 || echo "(container exited non-zero)"

      - name: R — root plus the identity capabilities, the fallback shape
        run: |
          set -uo pipefail
          echo "##################### R / runsc"
          docker run --rm -i --runtime=runsc --network=none \
            --cap-drop=ALL --cap-add=SYS_ADMIN --cap-add=SETUID --cap-add=SETGID --cap-add=SETPCAP \
            --tmpfs /kaas/source:rw,noexec,nosuid,nodev,size=8m \
            --tmpfs /kaas/control:rw,exec,suid,dev,size=8m,mode=0777 \
            -v /tmp/build/source-bootstrap:/bootstrap:ro \
            -v /tmp/fixtures:/fixtures:ro \
            -v /tmp/boundary.sh:/probe.sh:ro \
            alpine:3.20 /bootstrap < /tmp/bundle.frame 2>&1 || echo "(container exited non-zero)"

      - name: S — the negative controls for the mechanism as a whole
        run: |
          set -uo pipefail
          echo "##################### S1 / runsc  (no SYS_ADMIN: the freeze must fail and nothing may be ready)"
          docker run --rm -i --runtime=runsc --network=none \
            --user 65534:65534 --cap-drop=ALL \
            --tmpfs /kaas/source:rw,noexec,nosuid,nodev,size=8m,mode=0755,uid=65534,gid=65534 \
            -v /tmp/build/source-bootstrap:/bootstrap:ro \
            -v /tmp/boundary.sh:/probe.sh:ro \
            alpine:3.20 /bootstrap < /tmp/bundle.frame 2>&1 | head -8 || echo "(exited non-zero)"
          echo "##################### S2 / runsc  (a frame that does not fit)"
          docker run --rm -i --runtime=runsc --network=none \
            --user 65534:65534 --cap-drop=ALL --cap-add=SYS_ADMIN \
            --tmpfs /kaas/source:rw,noexec,nosuid,nodev,size=8m,mode=0755,uid=65534,gid=65534 \
            -v /tmp/build/source-bootstrap:/bootstrap:ro \
            -v /tmp/boundary.sh:/probe.sh:ro \
            alpine:3.20 /bootstrap < /tmp/big.frame 2>&1 | head -8 || echo "(exited non-zero)"
          echo "##################### S3 / runsc  (a truncated frame)"
          head -c 40 /tmp/bundle.frame > /tmp/short.frame
          docker run --rm -i --runtime=runsc --network=none \
            --user 65534:65534 --cap-drop=ALL --cap-add=SYS_ADMIN \
            --tmpfs /kaas/source:rw,noexec,nosuid,nodev,size=8m,mode=0755,uid=65534,gid=65534 \
            -v /tmp/build/source-bootstrap:/bootstrap:ro \
            -v /tmp/boundary.sh:/probe.sh:ro \
            alpine:3.20 /bootstrap < /tmp/short.frame 2>&1 | head -8 || echo "(exited non-zero)"

      - name: Clean up
        if: always()
        run: |
          docker ps -aq | xargs -r docker rm -f
