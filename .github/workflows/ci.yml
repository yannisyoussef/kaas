name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # The sandbox suite is excluded here and runs in its own mandatory job below. It ran in both, which
      # doubled a Docker-heavy suite inside this job's budget and, on any shared runner, put two launchers on
      # one daemon at once -- the condition under which the orphan reconciler's reclamation window and the
      # gate's container lifecycle interfere with each other.
      #
      # The synthetic-execution pipeline suite is excluded for the same reason and runs in its own mandatory
      # job below. It starts BOTH a PostgreSQL container and sandbox containers, so leaving it here would put
      # exactly the two-launchers-on-one-daemon condition back that excluding the sandbox suite removed.
      # The egress security suites are excluded for the same reason and run in `execution-egress-gate` below.
      # They build three images and run a proxy, a target, and a sandbox on real networks; leaving them here
      # would put the two-launchers-on-one-daemon condition back that the other exclusions removed.
      - run: >
          ./gradlew clean check --no-daemon
          -x :services:runner:test
          -x :services:runner:egressSecurityTest
          -x :tests:pipeline:test

  # The hostile-execution gate is a separate, mandatory job rather than a suite that skips when no daemon is
  # present. A security gate that quietly does not run is worse than one that fails: it produces a green build
  # that means nothing. GitHub-hosted Ubuntu runners provide the Docker daemon these tests require; if a future
  # runtime (gVisor, a microVM) cannot run here, this job must move to infrastructure that supports it rather
  # than being made conditional.
  #
  # This job is a REQUIRED status check on the default branch. Three properties follow from that and must not
  # be weakened:
  #
  #   1. It carries no job-level `if:`, no `continue-on-error`, and no path or branch filter. A required check
  #      is satisfied by a conclusion of success, skipped, OR neutral, so a job that skips itself when its
  #      prerequisites are missing would be indistinguishable from one that verified them.
  #   2. Missing prerequisites FAIL. No daemon, no probe image, no evidence: all of them fail this job.
  #   3. Its name is `hostile-execution-gate` and must stay globally unique across every workflow in this
  #      repository, because required-check resolution matches on job name alone and cannot disambiguate two
  #      jobs that share one.
  hostile-execution-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Confirm a container runtime is present
        run: docker version
      # cleanTest forces the sandbox suite to execute rather than be satisfied by an UP-TO-DATE result. A
      # cached or incremental pass would report this gate green without having started a single container,
      # which is the same failure the gate itself was just rebuilt to reject: absence of evidence is not
      # evidence of enforcement.
      - run: ./gradlew :services:runner:cleanTest :services:runner:check --no-daemon
      - name: Confirm the gate actually produced evidence
        run: |
          set -euo pipefail
          results=services/runner/build/test-results/test
          if [ ! -d "$results" ]; then
            echo "No test results were produced; the gate did not run." >&2
            exit 1
          fi
          executed=$(cat "$results"/*.xml | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | awk '{n+=$1} END {print n+0}')
          skipped=$(cat "$results"/*.xml | grep -o 'skipped="[0-9]*"' | grep -o '[0-9]*' | awk '{n+=$1} END {print n+0}')
          echo "executed=$executed skipped=$skipped"
          # A floor rather than an exact count, so adding tests does not break the gate while removing the
          # suite does. The boundary tests need a real daemon; the gate's red-path tests do not. If either
          # family disappears, this job fails instead of reporting a green build over an empty suite.
          if [ "$executed" -lt 40 ] || [ "$skipped" -ne 0 ]; then
            echo "Expected at least 40 executed tests and no skips." >&2
            exit 1
          fi
          # SyntheticWorkloadTests and SourceNonUseTests are named here because both assert security-relevant
          # properties that nothing else covers: that the workload never reports itself as an engine it is not,
          # and that the executor has no path to tenant feature source. A suite that silently stopped running
          # would take those guarantees with it.
          for required in HostileExecutionBoundaryTests SecurityGateRedPathTests OrphanReconciliationTests \
                          SyntheticWorkloadTests SourceNonUseTests UnenforceableCommandTests; do
            if ! ls "$results" | grep -q "$required"; then
              echo "$required did not run." >&2
              exit 1
            fi
          done
      # SIGNING THE ASSESSMENT IS PART OF WHAT THIS GATE MEANS.
      #
      # Extending this job rather than adding an eighth one, deliberately. The gate's claim is "this runtime
      # enforces what the platform requires"; producing a signed statement of that claim is the same claim
      # made transportable, not a separate concern. A new job would fragment one property across two required
      # checks and double the container work to prove it.
      #
      # THIS ATTESTATION DESCRIBES THE GITHUB RUNNER AND NOTHING ELSE. It is release evidence — the mechanism
      # works on a real host — and it is emphatically not deployment evidence. Its runtime subject says so,
      # and a control plane accepts a subject only if an operator configured that subject, so this artifact
      # cannot authorize anything anywhere.
      - name: Produce a signed attestation from what the gate just observed
        run: |
          set -euo pipefail
          # The repository's published test key. Its private half is in the tree deliberately: a key anyone
          # can read can never be mistaken for a production signer, and production has no default trust root
          # that would admit it. No production key is committed to make CI convenient.
          python3 - <<'PY' > "$RUNNER_TEMP/ci-signing-key.pk8"
          import json
          print(json.load(open("packages/api-contracts/fixtures/sandbox-security-attestation-signing/test-keys.json"))["keys"]["kaas-test-key-1"]["privateKeyPkcs8"], end="")
          PY
          chmod 600 "$RUNNER_TEMP/ci-signing-key.pk8"
          ./gradlew :services:runner:produceSandboxSecurityAttestation --no-daemon \
            -PkaasAttestationKeyId=kaas-test-key-1 \
            -PkaasAttestationPrivateKeyFile="$RUNNER_TEMP/ci-signing-key.pk8" \
            -PkaasAttestationRuntimeSubject=kaas.runtime.github-actions \
            -PkaasAttestationOutput="$RUNNER_TEMP/ci-attestation.json" \
            -PkaasAttestationIncludeEgress=false
          test -s "$RUNNER_TEMP/ci-attestation.json"

      - name: Confirm a strict verifier accepts it, and that tampering breaks it
        run: |
          set -euo pipefail
          public=$(python3 -c 'import json;print(json.load(open("packages/api-contracts/fixtures/sandbox-security-attestation-signing/test-keys.json"))["keys"]["kaas-test-key-1"]["publicKeySpki"])')
          # The control plane's OWN verifier, not a checker written for CI. A separate implementation would
          # eventually disagree with the one that matters, and the disagreement would surface as an outage.
          ./gradlew :apps:api:verifySandboxSecurityAttestation --no-daemon -q \
            -PkaasAttestationDocument="$RUNNER_TEMP/ci-attestation.json" \
            -PkaasAttestationTrustedKeys="kaas-test-key-1=$public" \
            -PkaasAttestationRuntimeSubjects=kaas.runtime.github-actions \
            -PkaasAttestationProfileVersion=kaas.sandbox.v1 | tee "$RUNNER_TEMP/verification.txt"
          grep -q '^verification=VALID' "$RUNNER_TEMP/verification.txt"
          grep -q '^authorizes=true' "$RUNNER_TEMP/verification.txt"
          # THE CONTROLS IN THE ARTIFACT ARE THE CONTROLS THE GATE REQUIRES. Sixteen is the size of the
          # contracted mandatory set; an artifact with a different number is one whose coverage check would
          # refuse it, and finding that here beats finding it at an authorization.
          grep -q '^mandatoryControls=16' "$RUNNER_TEMP/verification.txt"
          grep -q '^controlsNotPassing=\[\]' "$RUNNER_TEMP/verification.txt"

          # AND THE NEGATIVE. A green verification proves the verifier says yes; only this proves it can say
          # no. Without it, a verifier stubbed to return VALID would pass every check above.
          python3 - <<'PY'
          import json, os
          path = os.environ["RUNNER_TEMP"] + "/ci-attestation.json"
          document = json.load(open(path))
          document["mandatoryControls"]["NO_DOCKER_SOCKET"] = "FAIL"
          json.dump(document, open(os.environ["RUNNER_TEMP"] + "/tampered.json", "w"))
          PY
          if ./gradlew :apps:api:verifySandboxSecurityAttestation --no-daemon -q \
              -PkaasAttestationDocument="$RUNNER_TEMP/tampered.json" \
              -PkaasAttestationTrustedKeys="kaas-test-key-1=$public"; then
            echo "A tampered attestation verified. The signature is authenticating nothing." >&2
            exit 1
          fi

      - name: Remove any sandbox left behind by a failed run
        if: always()
        run: docker ps -aq --filter label=kaas.managed=true | xargs -r docker rm -f

  # The synthetic execution lifecycle, end to end, on a real database and a real container runtime.
  #
  # A separate mandatory job for the same reasons as the gate above, and the same three properties hold and
  # must not be weakened:
  #
  #   1. No job-level `if:`, no `continue-on-error`, no filters. A required check is satisfied by success,
  #      skipped, OR neutral, so a job that skips itself when Docker is absent would be indistinguishable from
  #      one that verified the whole lifecycle.
  #   2. Missing prerequisites FAIL. No daemon, no results, no evidence: all of them fail this job.
  #   3. Its name is `synthetic-execution-pipeline` and must stay globally unique across every workflow here,
  #      because required-check resolution matches on job name alone.
  #
  # This suite is what proves the two independent command-digest implementations agree, that the phase
  # transitions the database permits are the ones the runner drives, and that a result produced inside a
  # sandbox is accepted as evidence by a control plane that never saw it produced. None of that is provable
  # from either module alone.
  synthetic-execution-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Confirm a container runtime is present
        run: docker version
      # cleanTest for the same reason the gate uses it: an UP-TO-DATE result would report this green without
      # starting a database, a sandbox, or a control plane. The module also declares the probe build context
      # and the migration directory as task inputs, because both live in other modules and Gradle would
      # otherwise not consider them -- a schema or probe change would leave this suite cached and passing.
      - run: ./gradlew :tests:pipeline:cleanTest :tests:pipeline:test --no-daemon
      - name: Confirm the pipeline actually produced evidence
        run: |
          set -euo pipefail
          results=tests/pipeline/build/test-results/test
          if [ ! -d "$results" ]; then
            echo "No test results were produced; the pipeline suite did not run." >&2
            exit 1
          fi
          executed=$(cat "$results"/*.xml | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | awk '{n+=$1} END {print n+0}')
          skipped=$(cat "$results"/*.xml | grep -o 'skipped="[0-9]*"' | grep -o '[0-9]*' | awk '{n+=$1} END {print n+0}')
          echo "executed=$executed skipped=$skipped"
          # A floor, so adding tests does not break the gate while removing the suite does.
          if [ "$executed" -lt 20 ] || [ "$skipped" -ne 0 ]; then
            echo "Expected at least 20 executed tests and no skips." >&2
            exit 1
          fi
          for required in SyntheticExecutionPipelineTests CommandValidationPipelineTests \
                          LeaseRenewalPipelineTests; do
            if ! ls "$results" | grep -q "$required"; then
              echo "$required did not run." >&2
              exit 1
            fi
          done
      - name: Remove any sandbox left behind by a failed run
        if: always()
        run: docker ps -aq --filter label=kaas.managed=true | xargs -r docker rm -f

  # Enforceable execution egress, against a real Docker topology.
  #
  # A separate mandatory job for the same reasons as the two gates above, and the same properties hold:
  #
  #   1. No job-level `if:`, no `continue-on-error`, no path or branch filter. A required check is satisfied
  #      by success, skipped, OR neutral, so a job that skipped itself when Docker was absent would be
  #      indistinguishable from one that proved a sandbox cannot reach the internet.
  #   2. Missing prerequisites FAIL. No daemon, no proxy image, no DNS fixture, no evidence: each fails.
  #   3. Its name is `execution-egress-gate` and must stay globally unique across every workflow here,
  #      because required-check resolution matches on job name alone.
  #
  # What only this job can prove: that a sandbox reaches an authorized destination THROUGH the proxy and
  # cannot reach the same address directly. Neither half means anything alone — a sandbox with no network at
  # all satisfies the second, and one on a routed network satisfies the first — so the pair has to run
  # together, on a real daemon, or the allowlist is a claim nobody has checked.
  execution-egress-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Confirm a container runtime is present
        run: docker version
      # cleanTest-equivalent: the task is deleted before it runs, so an UP-TO-DATE result cannot satisfy this
      # gate. A cached pass would report green without having started a single container, which is the exact
      # failure this job exists to reject.
      - run: ./gradlew cleanEgressSecurityTest :services:runner:egressSecurityTest --no-daemon
      - name: Confirm the gate actually produced evidence
        run: |
          set -euo pipefail
          results=services/runner/build/test-results/egressSecurityTest
          if [ ! -d "$results" ]; then
            echo "No test results were produced; the egress gate did not run." >&2
            exit 1
          fi
          executed=$(cat "$results"/*.xml | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | awk '{n+=$1} END {print n+0}')
          skipped=$(cat "$results"/*.xml | grep -o 'skipped="[0-9]*"' | grep -o '[0-9]*' | awk '{n+=$1} END {print n+0}')
          echo "executed=$executed skipped=$skipped"
          # A floor rather than an exact count, so adding tests does not break the gate while deleting the
          # suite does. Zero skips: a skipped egress test is an unproven isolation claim.
          if [ "$executed" -lt 30 ] || [ "$skipped" -ne 0 ]; then
            echo "Expected at least 30 executed tests and no skips." >&2
            exit 1
          fi
          # Named individually because each carries a property nothing else covers: the no-bypass pair, the
          # resolve-once-and-connect-to-that-address rule, assignment-scoped authority including active
          # tunnel fencing, that a crashed runner leaves no gateway behind, that this host can enforce any
          # of it at all, and that the production path an execution actually takes creates the network, starts
          # the proxy, and starts no sandbox when it cannot. A suite that silently stopped running would take
          # its guarantee with it.
          for required in EgressTopologyBoundaryTests EgressDnsSecurityTests EgressAuthorizationTests \
                          EgressReconciliationTests EgressEnforcementGateTests \
                          EgressExecutionLifecycleTests; do
            if ! ls "$results" | grep -q "$required"; then
              echo "$required did not run." >&2
              exit 1
            fi
          done
      - name: Confirm no proxy, sandbox, or network outlived the run
        run: |
          set -euo pipefail
          containers=$(docker ps -aq --filter label=kaas.managed=true | wc -l | tr -d ' ')
          networks=$(docker network ls -q --filter label=kaas.managed=true | wc -l | tr -d ' ')
          echo "containers=$containers networks=$networks"
          # An orphaned proxy is a running egress gateway with no execution behind it, still holding a service
          # credential and still attached to the target network. Leaking one in CI is the same defect as
          # leaking one in production, and this is where it is cheap to notice.
          if [ "$containers" -ne 0 ] || [ "$networks" -ne 0 ]; then
            echo "KaaS-managed resources outlived the suite." >&2
            exit 1
          fi
      - name: Remove anything left behind by a failed run
        if: always()
        run: |
          docker ps -aq --filter label=kaas.managed=true | xargs -r docker rm -f
          docker network ls -q --filter label=kaas.managed=true | xargs -r docker network rm

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/api-contracts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/api-contracts/package-lock.json
      - run: npm ci
      - run: npm run validate:schemas
      - run: npm run lint:openapi

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: docker compose -f infrastructure/local/docker-compose.yml config
