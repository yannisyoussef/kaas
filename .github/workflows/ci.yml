name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # The sandbox suite is excluded here and runs in its own mandatory job below. It ran in both, which
      # doubled a Docker-heavy suite inside this job's budget and, on any shared runner, put two launchers on
      # one daemon at once -- the condition under which the orphan reconciler's reclamation window and the
      # gate's container lifecycle interfere with each other.
      #
      # The synthetic-execution pipeline suite is excluded for the same reason and runs in its own mandatory
      # job below. It starts BOTH a PostgreSQL container and sandbox containers, so leaving it here would put
      # exactly the two-launchers-on-one-daemon condition back that excluding the sandbox suite removed.
      # The egress security suites are excluded for the same reason and run in `execution-egress-gate` below.
      # They build three images and run a proxy, a target, and a sandbox on real networks; leaving them here
      # would put the two-launchers-on-one-daemon condition back that the other exclusions removed.
      - run: >
          ./gradlew clean check --no-daemon
          -x :services:runner:test
          -x :services:runner:egressSecurityTest
          -x :tests:pipeline:test

  # The hostile-execution gate is a separate, mandatory job rather than a suite that skips when no daemon is
  # present. A security gate that quietly does not run is worse than one that fails: it produces a green build
  # that means nothing. GitHub-hosted Ubuntu runners provide the Docker daemon these tests require; if a future
  # runtime (gVisor, a microVM) cannot run here, this job must move to infrastructure that supports it rather
  # than being made conditional.
  #
  # This job is a REQUIRED status check on the default branch. Three properties follow from that and must not
  # be weakened:
  #
  #   1. It carries no job-level `if:`, no `continue-on-error`, and no path or branch filter. A required check
  #      is satisfied by a conclusion of success, skipped, OR neutral, so a job that skips itself when its
  #      prerequisites are missing would be indistinguishable from one that verified them.
  #   2. Missing prerequisites FAIL. No daemon, no probe image, no evidence: all of them fail this job.
  #   3. Its name is `hostile-execution-gate` and must stay globally unique across every workflow in this
  #      repository, because required-check resolution matches on job name alone and cannot disambiguate two
  #      jobs that share one.
  hostile-execution-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Confirm a container runtime is present
        run: docker version
      # cleanTest forces the sandbox suite to execute rather than be satisfied by an UP-TO-DATE result. A
      # cached or incremental pass would report this gate green without having started a single container,
      # which is the same failure the gate itself was just rebuilt to reject: absence of evidence is not
      # evidence of enforcement.
      - run: ./gradlew :services:runner:cleanTest :services:runner:check --no-daemon
      - name: Confirm the gate actually produced evidence
        run: |
          set -euo pipefail
          results=services/runner/build/test-results/test
          if [ ! -d "$results" ]; then
            echo "No test results were produced; the gate did not run." >&2
            exit 1
          fi
          executed=$(cat "$results"/*.xml | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | awk '{n+=$1} END {print n+0}')
          skipped=$(cat "$results"/*.xml | grep -o 'skipped="[0-9]*"' | grep -o '[0-9]*' | awk '{n+=$1} END {print n+0}')
          echo "executed=$executed skipped=$skipped"
          # A floor rather than an exact count, so adding tests does not break the gate while removing the
          # suite does. The boundary tests need a real daemon; the gate's red-path tests do not. If either
          # family disappears, this job fails instead of reporting a green build over an empty suite.
          if [ "$executed" -lt 40 ] || [ "$skipped" -ne 0 ]; then
            echo "Expected at least 40 executed tests and no skips." >&2
            exit 1
          fi
          # SyntheticWorkloadTests and SourceNonUseTests are named here because both assert security-relevant
          # properties that nothing else covers: that the workload never reports itself as an engine it is not,
          # and that the executor has no path to tenant feature source. A suite that silently stopped running
          # would take those guarantees with it.
          for required in HostileExecutionBoundaryTests SecurityGateRedPathTests OrphanReconciliationTests \
                          SyntheticWorkloadTests SourceNonUseTests UnenforceableCommandTests; do
            if ! ls "$results" | grep -q "$required"; then
              echo "$required did not run." >&2
              exit 1
            fi
          done
      # SIGNING THE ASSESSMENT IS PART OF WHAT THIS GATE MEANS.
      #
      # Extending this job rather than adding an eighth one, deliberately. The gate's claim is "this runtime
      # enforces what the platform requires"; producing a signed statement of that claim is the same claim
      # made transportable, not a separate concern. A new job would fragment one property across two required
      # checks and double the container work to prove it.
      #
      # THIS ATTESTATION DESCRIBES THE GITHUB RUNNER AND NOTHING ELSE. It is release evidence — the mechanism
      # works on a real host — and it is emphatically not deployment evidence. Its runtime subject says so,
      # and a control plane accepts a subject only if an operator configured that subject, so this artifact
      # cannot authorize anything anywhere.
      - name: Produce a signed attestation from what the gate just observed
        run: |
          set -euo pipefail
          # The repository's published test key. Its private half is in the tree deliberately: a key anyone
          # can read can never be mistaken for a production signer, and production has no default trust root
          # that would admit it. No production key is committed to make CI convenient.
          python3 - <<'PY' > "$RUNNER_TEMP/ci-signing-key.pk8"
          import json
          print(json.load(open("packages/api-contracts/fixtures/sandbox-security-attestation-signing/test-keys.json"))["keys"]["kaas-test-key-1"]["privateKeyPkcs8"], end="")
          PY
          chmod 600 "$RUNNER_TEMP/ci-signing-key.pk8"
          ./gradlew :services:runner:produceSandboxSecurityAttestation --no-daemon \
            -PkaasAttestationKeyId=kaas-test-key-1 \
            -PkaasAttestationPrivateKeyFile="$RUNNER_TEMP/ci-signing-key.pk8" \
            -PkaasAttestationRuntimeSubject=kaas.runtime.github-actions \
            -PkaasAttestationOutput="$RUNNER_TEMP/ci-attestation.json" \
            -PkaasAttestationIncludeEgress=false
          test -s "$RUNNER_TEMP/ci-attestation.json"

      - name: Confirm a strict verifier accepts it, and that tampering breaks it
        run: |
          set -euo pipefail
          public=$(python3 -c 'import json;print(json.load(open("packages/api-contracts/fixtures/sandbox-security-attestation-signing/test-keys.json"))["keys"]["kaas-test-key-1"]["publicKeySpki"])')
          # The control plane's OWN verifier, not a checker written for CI. A separate implementation would
          # eventually disagree with the one that matters, and the disagreement would surface as an outage.
          ./gradlew :apps:api:verifySandboxSecurityAttestation --no-daemon -q \
            -PkaasAttestationDocument="$RUNNER_TEMP/ci-attestation.json" \
            -PkaasAttestationTrustedKeys="kaas-test-key-1=$public" \
            -PkaasAttestationRuntimeSubjects=kaas.runtime.github-actions \
            -PkaasAttestationProfileVersion=kaas.sandbox.v1 | tee "$RUNNER_TEMP/verification.txt"
          grep -q '^verification=VALID' "$RUNNER_TEMP/verification.txt"
          grep -q '^authorizes=true' "$RUNNER_TEMP/verification.txt"
          # THE CONTROLS IN THE ARTIFACT ARE THE CONTROLS THE GATE REQUIRES. An artifact with a different
          # number is one whose coverage check would refuse it, and finding that here beats finding it at an
          # authorization.
          #
          # Read from the contract rather than written here as a number. It was hardcoded to 16 and broke the
          # moment the mandatory set grew -- a literal in a shell script is a fourth copy of a set that three
          # modules already have a contract test to keep in agreement.
          expected=$(python3 -c "import json;print(len(json.load(open('packages/api-contracts/mandatory-sandbox-controls.json'))['controlsByProfileVersion']['kaas.sandbox.v1']))")
          echo "the contract requires $expected mandatory controls under kaas.sandbox.v1"
          grep -q "^mandatoryControls=$expected" "$RUNNER_TEMP/verification.txt"
          grep -q '^controlsNotPassing=\[\]' "$RUNNER_TEMP/verification.txt"

          # AND THE NEGATIVE. A green verification proves the verifier says yes; only this proves it can say
          # no. Without it, a verifier stubbed to return VALID would pass every check above.
          python3 - <<'PY'
          import json, os
          path = os.environ["RUNNER_TEMP"] + "/ci-attestation.json"
          document = json.load(open(path))
          document["mandatoryControls"]["NO_DOCKER_SOCKET"] = "FAIL"
          json.dump(document, open(os.environ["RUNNER_TEMP"] + "/tampered.json", "w"))
          PY
          if ./gradlew :apps:api:verifySandboxSecurityAttestation --no-daemon -q \
              -PkaasAttestationDocument="$RUNNER_TEMP/tampered.json" \
              -PkaasAttestationTrustedKeys="kaas-test-key-1=$public"; then
            echo "A tampered attestation verified. The signature is authenticating nothing." >&2
            exit 1
          fi

      - name: Remove any sandbox left behind by a failed run
        if: always()
        run: docker ps -aq --filter label=kaas.managed=true | xargs -r docker rm -f

  # The synthetic execution lifecycle, end to end, on a real database and a real container runtime.
  #
  # A separate mandatory job for the same reasons as the gate above, and the same three properties hold and
  # must not be weakened:
  #
  #   1. No job-level `if:`, no `continue-on-error`, no filters. A required check is satisfied by success,
  #      skipped, OR neutral, so a job that skips itself when Docker is absent would be indistinguishable from
  #      one that verified the whole lifecycle.
  #   2. Missing prerequisites FAIL. No daemon, no results, no evidence: all of them fail this job.
  #   3. Its name is `synthetic-execution-pipeline` and must stay globally unique across every workflow here,
  #      because required-check resolution matches on job name alone.
  #
  # This suite is what proves the two independent command-digest implementations agree, that the phase
  # transitions the database permits are the ones the runner drives, and that a result produced inside a
  # sandbox is accepted as evidence by a control plane that never saw it produced. None of that is provable
  # from either module alone.
  synthetic-execution-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Confirm a container runtime is present
        run: docker version
      # cleanTest for the same reason the gate uses it: an UP-TO-DATE result would report this green without
      # starting a database, a sandbox, or a control plane. The module also declares the probe build context
      # and the migration directory as task inputs, because both live in other modules and Gradle would
      # otherwise not consider them -- a schema or probe change would leave this suite cached and passing.
      - run: ./gradlew :tests:pipeline:cleanTest :tests:pipeline:test --no-daemon
      - name: Confirm the pipeline actually produced evidence
        run: |
          set -euo pipefail
          results=tests/pipeline/build/test-results/test
          if [ ! -d "$results" ]; then
            echo "No test results were produced; the pipeline suite did not run." >&2
            exit 1
          fi
          executed=$(cat "$results"/*.xml | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | awk '{n+=$1} END {print n+0}')
          skipped=$(cat "$results"/*.xml | grep -o 'skipped="[0-9]*"' | grep -o '[0-9]*' | awk '{n+=$1} END {print n+0}')
          echo "executed=$executed skipped=$skipped"
          # A floor, so adding tests does not break the gate while removing the suite does.
          if [ "$executed" -lt 20 ] || [ "$skipped" -ne 0 ]; then
            echo "Expected at least 20 executed tests and no skips." >&2
            exit 1
          fi
          for required in SyntheticExecutionPipelineTests CommandValidationPipelineTests \
                          LeaseRenewalPipelineTests; do
            if ! ls "$results" | grep -q "$required"; then
              echo "$required did not run." >&2
              exit 1
            fi
          done
      - name: Remove any sandbox left behind by a failed run
        if: always()
        run: docker ps -aq --filter label=kaas.managed=true | xargs -r docker rm -f

  # Enforceable execution egress, against a real Docker topology.
  #
  # A separate mandatory job for the same reasons as the two gates above, and the same properties hold:
  #
  #   1. No job-level `if:`, no `continue-on-error`, no path or branch filter. A required check is satisfied
  #      by success, skipped, OR neutral, so a job that skipped itself when Docker was absent would be
  #      indistinguishable from one that proved a sandbox cannot reach the internet.
  #   2. Missing prerequisites FAIL. No daemon, no proxy image, no DNS fixture, no evidence: each fails.
  #   3. Its name is `execution-egress-gate` and must stay globally unique across every workflow here,
  #      because required-check resolution matches on job name alone.
  #
  # What only this job can prove: that a sandbox reaches an authorized destination THROUGH the proxy and
  # cannot reach the same address directly. Neither half means anything alone — a sandbox with no network at
  # all satisfies the second, and one on a routed network satisfies the first — so the pair has to run
  # together, on a real daemon, or the allowlist is a claim nobody has checked.
  execution-egress-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Confirm a container runtime is present
        run: docker version
      # cleanTest-equivalent: the task is deleted before it runs, so an UP-TO-DATE result cannot satisfy this
      # gate. A cached pass would report green without having started a single container, which is the exact
      # failure this job exists to reject.
      - run: ./gradlew cleanEgressSecurityTest :services:runner:egressSecurityTest --no-daemon
      - name: Confirm the gate actually produced evidence
        run: |
          set -euo pipefail
          results=services/runner/build/test-results/egressSecurityTest
          if [ ! -d "$results" ]; then
            echo "No test results were produced; the egress gate did not run." >&2
            exit 1
          fi
          executed=$(cat "$results"/*.xml | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | awk '{n+=$1} END {print n+0}')
          skipped=$(cat "$results"/*.xml | grep -o 'skipped="[0-9]*"' | grep -o '[0-9]*' | awk '{n+=$1} END {print n+0}')
          echo "executed=$executed skipped=$skipped"
          # A floor rather than an exact count, so adding tests does not break the gate while deleting the
          # suite does. Zero skips: a skipped egress test is an unproven isolation claim.
          if [ "$executed" -lt 30 ] || [ "$skipped" -ne 0 ]; then
            echo "Expected at least 30 executed tests and no skips." >&2
            exit 1
          fi
          # Named individually because each carries a property nothing else covers: the no-bypass pair, the
          # resolve-once-and-connect-to-that-address rule, assignment-scoped authority including active
          # tunnel fencing, that a crashed runner leaves no gateway behind, that this host can enforce any
          # of it at all, and that the production path an execution actually takes creates the network, starts
          # the proxy, and starts no sandbox when it cannot. A suite that silently stopped running would take
          # its guarantee with it.
          for required in EgressTopologyBoundaryTests EgressDnsSecurityTests EgressAuthorizationTests \
                          EgressReconciliationTests EgressEnforcementGateTests \
                          EgressExecutionLifecycleTests; do
            if ! ls "$results" | grep -q "$required"; then
              echo "$required did not run." >&2
              exit 1
            fi
          done
      - name: Confirm no proxy, sandbox, or network outlived the run
        run: |
          set -euo pipefail
          containers=$(docker ps -aq --filter label=kaas.managed=true | wc -l | tr -d ' ')
          networks=$(docker network ls -q --filter label=kaas.managed=true | wc -l | tr -d ' ')
          echo "containers=$containers networks=$networks"
          # An orphaned proxy is a running egress gateway with no execution behind it, still holding a service
          # credential and still attached to the target network. Leaking one in CI is the same defect as
          # leaking one in production, and this is where it is cheap to notice.
          if [ "$containers" -ne 0 ] || [ "$networks" -ne 0 ]; then
            echo "KaaS-managed resources outlived the suite." >&2
            exit 1
          fi
      - name: Remove anything left behind by a failed run
        if: always()
        run: |
          docker ps -aq --filter label=kaas.managed=true | xargs -r docker rm -f
          docker network ls -q --filter label=kaas.managed=true | xargs -r docker network rm

  # The FIRST EXECUTION of code the platform did not write.
  #
  # Every other gate in this file measures a boundary with a platform-authored probe. This one starts real
  # Karate 2.1.2 on a real frozen source filesystem and runs real tenant features through it, which is a
  # different claim: not that a probe observed containment, but that the product executed inside it.
  #
  # WHY IT RUNS UNDER THE MEDIATING RUNTIME, and cannot run under the baseline one.
  #
  # The engine runs on a source filesystem the bootstrap populates and then closes behind itself, and closing
  # it is a `mount` the baseline runtime refuses: docs/architecture/mediated-source-filesystem-evaluation.md
  # records `bootstrap_failure=FREEZE` for exactly that request under runc. So there is no baseline version of
  # this gate to have. It was written as one, and it was green on macOS -- where Docker Desktop's VM carries no
  # AppArmor policy and the remount therefore succeeds -- while every test in it failed on this runner. A
  # mechanism that only works under one runtime can only be measured under that runtime.
  #
  # Its own mandatory job for the usual reason -- a gate inside a general build is one line in a long log --
  # and one specific to it: this is where "secret-free" stops being a document and becomes a measurement. The
  # suite asserts the engine's environment is exactly three shell- and launcher-created names, so a variable
  # reaching the JVM that runs tenant code turns this job red.
  #
  # The name `karate-execution-gate` must stay globally unique: required-check resolution matches on job name.
  karate-execution-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Confirm a container runtime is present
        run: docker version
      - uses: ./.github/actions/install-mediating-runtime
      # Deleted before it runs, so an UP-TO-DATE result cannot satisfy this gate. A cached pass would report
      # green without having started an engine.
      - run: ./gradlew cleanKarateExecutionTest :services:runner:karateExecutionTest --no-daemon
      # A failure here is a statement about what an engine could reach, so it has to be readable from the log
      # alone. Gradle's console prints only the assertion's line number, and the useful part -- what the
      # sandbox actually reported -- lives in the XML. Without this the first failure of this gate cost a
      # round trip to find out that the bootstrap had reported FREEZE and no engine had started at all.
      - name: Report what the engine actually did
        if: failure()
        run: |
          results=services/runner/build/test-results/karateExecutionTest
          [ -d "$results" ] || { echo "No results; the suite never started."; exit 0; }
          python3 - "$results" <<'PYEOF'
          import glob, sys, xml.etree.ElementTree as ET
          for path in sorted(glob.glob(sys.argv[1] + "/*.xml")):
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  for bad in list(case.iter("failure")) + list(case.iter("error")):
                      print("=" * 78)
                      print(case.get("name"))
                      print("-" * 78)
                      print((bad.get("message") or "").strip()[:4000])
          PYEOF
      # The engine module's own suite: it reads the jar rather than a line the adapter printed, which is what
      # makes the version claim independent of the adapter's own honesty.
      - run: ./gradlew :services:karate-engine:cleanTest :services:karate-engine:test --no-daemon
      # KAAS-22 HARDENING. What this step and the next ask used to be answerable by less than the suite:
      # a floor of nine executed tests against a suite of eleven, no check that the suite that ran was the
      # one this gate exists for, evidence that could silently not be written, no record of which runtime
      # ran, and a leak check that looked at containers only.
      - name: Confirm the gate executed the whole Karate suite
        run: |
          set -euo pipefail
          python3 .github/scripts/junit-gate.py services/runner/build/test-results/karateExecutionTest \
            --require com.kaas.runner.sandbox.KarateExecutionTests=11
          python3 .github/scripts/junit-gate.py services/karate-engine/build/test-results/test \
            --require com.kaas.karate.KaasKarateAdapterTest=7 --require com.kaas.karate.EngineFrameTest=4
      # ANTI-VACUITY, in the gate rather than only in the assertions. The engine names itself from karate-core's
      # own metadata, the runtime is the one the DAEMON reports it assigned (read back before the engine
      # started), and the secret channel is the adapter confirming it read its frame and closed stdin. Read out
      # of an evidence file the suite writes into a build-owned directory -- a suite that could not write it
      # fails -- and never out of the JUnit XML, which carries only a failure's message.
      - name: Confirm a mediated Karate engine named itself
        run: |
          set -euo pipefail
          python3 .github/scripts/evidence-gate.py \
            services/runner/build/evidence/karateExecutionTest/karate-execution-evidence.txt \
            engine_identity='karate 2.1.2' engine_verdict=PASSED runtime=runsc secret_channel=CONSUMED
      - name: Confirm nothing outlived the run
        run: |
          set -euo pipefail
          .github/scripts/leak-gate.sh
      - name: Remove anything left behind by a failed run
        if: always()
        run: |
          docker ps -aq --filter label=kaas.managed=true | xargs -r docker rm -f
          docker network ls -q --filter label=kaas.managed=true | xargs -r docker network rm

  # SECRET-BEARING KARATE (KAAS-22): the tenth mandatory job.
  #
  # Its own job because nothing else can host it: it needs a real Vault Transit, the mediating runtime, a real
  # secret capability, a real secret-bearing engine, and a Docker daemon whose persistent logging can be
  # inspected while the sandbox is alive. Two suites:
  #
  #   * secretExecutionTest (runner): secret-bearing Karate inside the sandbox, measured from both sides of the
  #     boundary -- raw prints the trusted collector saw and redacted, the daemon's log driver and stored logs
  #     while the container ran, container metadata, the engine's environment, command line, properties,
  #     descriptors, stdin after the frame, and its crash/dump posture.
  #   * secretExecutionPipelineTest (pipeline): the whole chain -- a runtime-generated value written through the
  #     tenant API, encrypted by Vault, pinned, capability-issued, redeemed, delivered, used by Karate under
  #     runsc through the real egress proxy to authenticate to a target that accepts ONLY that exact value --
  #     plus the wrong-value control, a revoked version, and a sealed Vault beside a secret-free run.
  #
  # Every value is generated inside the test JVM and never reaches the shell, the workflow environment or a
  # step output. What the shell holds is a random NONCE embedded in every generated value, which is not a
  # secret: it lets the report scan below find a leaked value without ever being told one.
  #
  # The same rules as every gate: no job-level `if:`, no `continue-on-error`, no path filter; the runtime is
  # installed from the one shared pinned action; and `secret-execution-gate` must stay globally unique.
  secret-execution-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Confirm a container runtime is present
        run: docker version
      - uses: ./.github/actions/install-mediating-runtime
      - name: Choose this run's sentinel nonce
        run: |
          set -euo pipefail
          nonce=$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n')
          echo "KAAS_SENTINEL_NONCE=$nonce" >> "$GITHUB_ENV"
      # Deleted before they run, so an UP-TO-DATE result cannot satisfy this gate.
      - run: ./gradlew cleanSecretExecutionTest :services:runner:secretExecutionTest --no-daemon
      - run: ./gradlew :tests:pipeline:cleanSecretExecutionPipelineTest :tests:pipeline:secretExecutionPipelineTest --no-daemon
      - name: Report what the suites observed
        if: failure()
        run: |
          for results in services/runner/build/test-results/secretExecutionTest tests/pipeline/build/test-results/secretExecutionPipelineTest; do
            [ -d "$results" ] || { echo "No results in $results."; continue; }
            python3 - "$results" <<'PYEOF'
          import glob, os, re, sys, xml.etree.ElementTree as ET
          # Every generated value carries the nonce, so any token containing it is masked before this log --
          # which is public -- ever sees it. The suites assert on booleans, but a failure message is written by
          # whatever failed, and this step exists precisely for the runs where something did.
          nonce = os.environ.get("KAAS_SENTINEL_NONCE", "")
          def masked(text):
              return re.sub(r"\S*" + re.escape(nonce) + r"\S*", "[GENERATED-VALUE]", text) if nonce else text
          for path in sorted(glob.glob(sys.argv[1] + "/*.xml")):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for bad in list(case.iter("failure")) + list(case.iter("error")):
                      print("=" * 78); print(case.get("name")); print("-" * 78)
                      print(masked((bad.get("message") or "").strip()[:4000]))
          PYEOF
          done
      - name: Confirm both suites ran whole
        run: |
          set -euo pipefail
          python3 .github/scripts/junit-gate.py services/runner/build/test-results/secretExecutionTest \
            --require com.kaas.runner.sandbox.SecretBearingKarateExecutionTests=6
          python3 .github/scripts/junit-gate.py tests/pipeline/build/test-results/secretExecutionPipelineTest \
            --require com.kaas.pipeline.SecretExecutionPipelineTests=5
      # Every line the suites wrote, exactly: a key must carry the expected value and no other. The evidence is
      # written from trusted observations -- the collector's match counts, the daemon's own answers, the target's
      # own log, Vault's own decryption -- so each line can only be true if the thing it names happened.
      - name: Confirm the in-sandbox evidence
        run: |
          set -euo pipefail
          python3 .github/scripts/evidence-gate.py \
            services/runner/build/evidence/secretExecutionTest/secret-execution-evidence.txt \
            raw_stdout_secret_observed=true raw_stderr_secret_observed=true persisted_raw_secret=false \
            engine_identity='karate 2.1.2' engine_verdict=PASSED runtime=runsc \
            docker_log_driver=none docker_persistent_secret=false secret_in_container_metadata=false \
            secret_in_environment=false secret_in_cmdline=false secret_in_system_properties=false \
            engine_stdin_after_frame=-1 sentinel_nonce_applied=true
      - name: Confirm the end-to-end evidence
        run: |
          set -euo pipefail
          python3 .github/scripts/evidence-gate.py \
            tests/pipeline/build/evidence/secretExecutionPipelineTest/secret-pipeline-evidence.txt \
            secret_provider=vault-transit secret_provider_auth=VALID secret_encryption=VALID \
            secret_version_pinned=true secret_capability=VALID secret_redemption=VALID \
            secret_authenticated_request=true raw_stdout_secret_observed=true raw_stderr_secret_observed=true \
            persisted_raw_secret=false redaction=VALID secret_in_database=false secret_in_queue=false \
            secret_in_host_files=false secret_in_proxy_logs=false engine_identity='karate 2.1.2' \
            engine_verdict=PASSED runtime=runsc revoked_version_refused=true \
            provider_outage_refused_secret_run=true secret_free_run_with_provider_down=PASSED \
            sentinel_nonce_applied=true
      # THE TEST-REPORT LEAK, checked from outside the JVM. Every generated value carries this run's nonce, so
      # a value that reached a JUnit XML, an HTML report or anything else the build wrote is found by the nonce
      # alone. The control is planted INSIDE a scanned tree and must be among the hits, so the scan is shown to
      # have walked the directories it names, not merely to work on some other file. grep's status is read
      # explicitly: 0 found something, 1 found nothing, anything else is a scan that failed -- and a failed scan
      # is a failed gate, never a clean one. Runs after a failure too: a failing run is when a leak is likeliest.
      - name: Confirm no generated secret reached a report or build output
        if: always()
        run: |
          set -euo pipefail
          [ -n "${KAAS_SENTINEL_NONCE:-}" ] || { echo "No sentinel nonce was set." >&2; exit 1; }
          roots="services/runner/build tests/pipeline/build apps/api/build"
          for root in $roots; do
            [ -d "$root" ] || { echo "Scan root $root does not exist." >&2; exit 1; }
          done
          control="services/runner/build/nonce-scan-control.txt"
          printf 'control-%s\n' "$KAAS_SENTINEL_NONCE" > "$control"
          status=0
          hits=$(grep -rlF -- "$KAAS_SENTINEL_NONCE" $roots) || status=$?
          rm -f "$control"
          if [ "$status" -ne 0 ]; then
            echo "The scan failed (grep status $status); with its control planted it must find at least one file." >&2
            exit 1
          fi
          printf '%s\n' "$hits" | grep -qxF "$control" || { echo "The scan did not find its own control." >&2; exit 1; }
          others=$(printf '%s\n' "$hits" | grep -vxF "$control" || true)
          if [ -n "$others" ]; then
            printf '%s\n' "$others"
            echo "A generated secret value reached build output (files listed above)." >&2
            exit 1
          fi
          echo "sentinel_in_reports=false"
      - name: Confirm nothing outlived the run
        run: |
          set -euo pipefail
          .github/scripts/leak-gate.sh
      - name: Remove anything left behind by a failed run
        if: always()
        run: |
          docker ps -aq --filter label=kaas.managed=true | xargs -r docker rm -f
          docker network ls -q --filter label=kaas.managed=true | xargs -r docker network rm

  # The security gate, run under the MEDIATING RUNTIME rather than the baseline one.
  #
  # A separate mandatory job for the same reasons as the gates above, plus one specific to it: the runtime
  # cannot be installed on macOS/Docker Desktop, so this job and `karate-execution-gate` are the ONLY places
  # the stronger boundary is ever exercised. A green local build proves nothing about it. Both install the
  # runtime from one pinned digest, in `.github/actions/install-mediating-runtime`: two copies of that pin
  # would eventually differ, and two jobs would then measure two runtimes while reporting the same claim.
  #
  #   1. No job-level `if:`, no `continue-on-error`, no path or branch filter. A required check is satisfied by
  #      success, skipped, OR neutral, so a job that skipped itself when runsc was absent would be
  #      indistinguishable from one that proved a workload was confined by it.
  #   2. Missing runtime FAILS. The suite asserts the daemon has it before running anything, so "not installed"
  #      is a red gate rather than an empty one.
  #   3. Its name is `strong-runtime-gate` and must stay globally unique, because required-check resolution
  #      matches on job name alone.
  strong-runtime-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - uses: ./.github/actions/install-mediating-runtime


      # Registration is not execution, and the two failures look nothing alike. This step establishes WHICH
      # network shapes the mediating runtime can actually carry on this host before the suite runs, so a later
      # failure is never ambiguous between "the runtime is broken here" and "the profile asks for something it
      # cannot do".
      #
      # It deliberately does not stop on the first failure: the whole point is the matrix, and stopping early
      # would report the first incompatibility as if it were the only one.
      - name: Establish what the mediating runtime can carry
        run: |
          echo "cgroups/driver/kernel: $(docker info --format '{{.CgroupVersion}} {{.CgroupDriver}} {{.KernelVersion}}')"
          echo "init netns: $(readlink /proc/1/ns/net)  self netns: $(readlink /proc/self/ns/net)"
          docker network create --internal kaas-runtime-probe >/dev/null
          status=0
          for net in none bridge kaas-runtime-probe; do
            echo "===== --network=$net under runsc"
            if docker run --rm --runtime=runsc --network=$net alpine:3.20 \
                 sh -c 'cat /proc/version; ip -o link 2>/dev/null | wc -l'; then
              echo "RESULT $net: ok"
            else
              echo "RESULT $net: unsupported"
              [ "$net" = none ] && status=1
            fi
          done
          echo "===== the full sandbox profile shape under runsc"
          docker run --rm --runtime=runsc --network=none --user 65534:65534 --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges:true --pids-limit 64 --memory 256m \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            alpine:3.20 sh -c 'id; cat /proc/version' || { echo "RESULT profile: unsupported"; status=1; }
          docker network rm kaas-runtime-probe >/dev/null
          # Only the shape the sandbox actually uses is fatal here. Bridge compatibility is the open question
          # this slice exists to answer, and the suite -- not this step -- is what makes a claim about it.
          exit $status

      # THE LEAK CHECK, CHECKED. Both directions, before it is relied on below.
      #
      # This step exists because the leak check has been wrong twice, in opposite directions, and each time it
      # still reported a number that looked like evidence. `pgrep -c` on the runtime name could never match
      # the sentry, because gVisor re-executes it under a different process name. Grepping the whole argument
      # list matched the checking script's own command line and could never reach zero.
      #
      # A safety check whose answer does not depend on the hazard is not evidence, so this runs the exact rule
      # used below against a host that demonstrably HAS a sentry and then against one that does not.
      - name: Confirm the leak check can see a sentry, and can see its absence
        run: |
          set -euo pipefail
          count() { ps -eo args= | awk '{print $1}' | grep -cE '(^|/)runsc(-sandbox|-gofer)?$' || true; }

          before=$(count)
          if [ "$before" -ne 0 ]; then
            echo "The runner already had runtime processes before this step; the check below proves nothing." >&2
            exit 1
          fi

          docker run -d --name leak-probe --runtime=runsc --network=none alpine:3.20 sleep 120 >/dev/null
          # The sentry does not appear at the same instant the daemon returns, so this waits rather than
          # asserting cold -- the same race that made an earlier version of the revocation test flaky.
          for _ in $(seq 1 50); do
            [ "$(count)" -gt 0 ] && break
            sleep 0.2
          done
          during=$(count)
          echo "with a mediated container running: $during"

          docker rm -f leak-probe >/dev/null
          for _ in $(seq 1 50); do
            [ "$(count)" -eq 0 ] && break
            sleep 0.2
          done
          after=$(count)
          echo "after removing it: $after"

          if [ "$during" -eq 0 ]; then
            echo "The leak check cannot see a sentry that exists. It would report a clean host either way." >&2
            exit 1
          fi
          if [ "$after" -ne 0 ]; then
            echo "The leak check cannot see the absence of a sentry. It would fail a clean host." >&2
            exit 1
          fi

      # THE PRODUCTION PATH, under the mediating runtime, end to end.
      #
      # Everything else about this runtime is exercised by suites that build their own profile. This runs the
      # component an operator actually runs -- the producer CLI -- and hands what it writes to the component
      # the control plane actually uses. The producer hardcoded the baseline runtime until a review found it:
      # every test passed, and no operator could have produced evidence for the stronger boundary.
      - name: Produce and verify a mediated attestation the way an operator would
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/ci-signing-key.pk8"
          import json
          print(json.load(open("packages/api-contracts/fixtures/sandbox-security-attestation-signing/test-keys.json"))["keys"]["kaas-test-key-1"]["privateKeyPkcs8"], end="")
          PY
          chmod 600 "$RUNNER_TEMP/ci-signing-key.pk8"
          ./gradlew :services:runner:produceSandboxSecurityAttestation --no-daemon \
            -PkaasAttestationKeyId=kaas-test-key-1 \
            -PkaasAttestationPrivateKeyFile="$RUNNER_TEMP/ci-signing-key.pk8" \
            -PkaasAttestationRuntimeSubject=kaas.runtime.github-actions \
            -PkaasAttestationSandboxRuntime=gvisor \
            -PkaasAttestationOutput="$RUNNER_TEMP/mediated-attestation.json" \
            -PkaasAttestationIncludeEgress=false
          # It says what it ran behind, and it says so in the SIGNED payload.
          python3 -c "
          import json,sys
          d=json.load(open('$RUNNER_TEMP/mediated-attestation.json'))
          assert d['sandboxRuntime']=='GVISOR', d['sandboxRuntime']
          assert d['securityProfileVersion']=='kaas.sandbox.gvisor.v1', d['securityProfileVersion']
          print('mediated attestation:', d['securityProfileVersion'], d['sandboxRuntime'],
                len(d['mandatoryControls']), 'controls')
          "
          public=$(python3 -c 'import json;print(json.load(open("packages/api-contracts/fixtures/sandbox-security-attestation-signing/test-keys.json"))["keys"]["kaas-test-key-1"]["publicKeySpki"])')
          # The control plane's OWN verifier, told to expect the mediating profile.
          ./gradlew :apps:api:verifySandboxSecurityAttestation --no-daemon -q \
            -PkaasAttestationDocument="$RUNNER_TEMP/mediated-attestation.json" \
            -PkaasAttestationTrustedKeys="kaas-test-key-1=$public" \
            -PkaasAttestationRuntimeSubjects=kaas.runtime.github-actions \
            -PkaasAttestationProfileVersion=kaas.sandbox.gvisor.v1 | tee "$RUNNER_TEMP/mediated-verification.txt"
          grep -q '^verification=VALID' "$RUNNER_TEMP/mediated-verification.txt"
          grep -q '^authorizes=true' "$RUNNER_TEMP/mediated-verification.txt"
          expected=$(python3 -c "import json;print(len(json.load(open('packages/api-contracts/mandatory-sandbox-controls.json'))['controlsByProfileVersion']['kaas.sandbox.gvisor.v1']))")
          grep -q "^mandatoryControls=$expected" "$RUNNER_TEMP/mediated-verification.txt"
          grep -q '^controlsNotPassing=\[\]' "$RUNNER_TEMP/mediated-verification.txt"

          # WHICH BINARY THE EVIDENCE DESCRIBES, and whether the control plane actually checks it.
          #
          # The producer measured the runtime from the daemon's own registration; there is no option that
          # sets these, so what the document says is what was on disk. This reads them back and compares the
          # digest against the file this job installed, because a producer that measured the wrong binary
          # would be confident evidence about a program the daemon will never run.
          grep -q '^runtimeImplementationName=runsc$' "$RUNNER_TEMP/mediated-verification.txt"
          installed=$(sha256sum /usr/local/bin/runsc | cut -d" " -f1)
          grep -q "^runtimeImplementationDigest=sha256:$installed$" "$RUNNER_TEMP/mediated-verification.txt"
          grep -q '^runtimeImplementationVersion=runsc version' "$RUNNER_TEMP/mediated-verification.txt"
          echo "runtime_name=runsc"
          echo "runtime_sha256=$installed"
          echo "runtime_version=$(runsc --version | head -1)"
          echo "attestation_verification=VALID"

          # AND THE INVARIANT THAT MAKES ANY OF IT WORTH SIGNING: evidence for one runtime binary must not
          # authorize execution under another.
          #
          # Everything else is held constant -- same daemon, same profile, same key, same subject, same
          # controls, same document -- and only the accepted implementation is changed to a different digest.
          # If this authorized, then replacing runsc would leave every existing attestation valid, which is
          # exactly the gap KAAS-20 exists to close.
          if ./gradlew :apps:api:verifySandboxSecurityAttestation --no-daemon -q \
              -PkaasAttestationDocument="$RUNNER_TEMP/mediated-attestation.json" \
              -PkaasAttestationTrustedKeys="kaas-test-key-1=$public" \
              -PkaasAttestationRuntimeSubjects=kaas.runtime.github-actions \
              -PkaasAttestationProfileVersion=kaas.sandbox.gvisor.v1 \
              -PkaasAttestationRuntimeImplementations="sha256:$(printf 'b%.0s' $(seq 64))" \
              | grep -q '^authorizes=true'; then
            echo "Evidence for one runtime binary authorized execution under another." >&2
            exit 1
          fi
          echo "runtime_change_invalidates_evidence=true"

          # AND THE NEGATIVE. The same authentic document must NOT authorize a deployment running the
          # baseline: evidence for one boundary is not evidence for the other.
          if ./gradlew :apps:api:verifySandboxSecurityAttestation --no-daemon -q \
              -PkaasAttestationDocument="$RUNNER_TEMP/mediated-attestation.json" \
              -PkaasAttestationTrustedKeys="kaas-test-key-1=$public" \
              -PkaasAttestationRuntimeSubjects=kaas.runtime.github-actions \
              -PkaasAttestationProfileVersion=kaas.sandbox.v1 | grep -q '^authorizes=true'; then
            echo "Mediated evidence authorized a baseline deployment." >&2
            exit 1
          fi

      # cleanTest-equivalent: the task is deleted before it runs, so an UP-TO-DATE result cannot satisfy this
      # gate. A cached pass would report green without having started a single mediated container.
      - run: ./gradlew cleanStrongRuntimeTest :services:runner:strongRuntimeTest --no-daemon

      # A failure here is a statement about the runtime boundary, so it has to be readable from the log alone.
      # Gradle's console prints only the assertion's line number, and the useful part -- which control blocked,
      # and what the sandbox actually observed -- lives in the XML.
      - name: Report what the boundary actually did
        if: failure()
        run: |
          results=services/runner/build/test-results/strongRuntimeTest
          [ -d "$results" ] || { echo "No results; the suite never started."; exit 0; }
          python3 - "$results" <<'PYEOF'
          import glob, sys, xml.etree.ElementTree as ET
          for path in sorted(glob.glob(sys.argv[1] + "/*.xml")):
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  for bad in list(case.iter("failure")) + list(case.iter("error")):
                      print("=" * 78)
                      print(case.get("name"))
                      print("-" * 78)
                      print((bad.get("message") or "").strip()[:4000])
          PYEOF

      - name: Confirm the gate actually produced evidence
        run: |
          set -euo pipefail
          results=services/runner/build/test-results/strongRuntimeTest
          if [ ! -d "$results" ]; then
            echo "No test results were produced; the gate did not run." >&2
            exit 1
          fi
          executed=$(cat "$results"/*.xml | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | awk '{n+=$1} END {print n+0}')
          skipped=$(cat "$results"/*.xml | grep -o 'skipped="[0-9]*"' | grep -o '[0-9]*' | awk '{n+=$1} END {print n+0}')
          echo "executed=$executed skipped=$skipped"
          # Zero skips is the load-bearing half. A suite that skipped itself because the runtime was absent is
          # exactly the outcome this job exists to make impossible.
          if [ "$executed" -lt 19 ] || [ "$skipped" -ne 0 ]; then
            echo "Expected at least 19 executed tests and no skips." >&2
            exit 1
          fi
          for suite in StrongRuntimeBoundaryTests StrongRuntimeAuthorityRevocationTests \
                       MediatedSourceFilesystemBoundaryTests HostileJvmContainmentTests; do
            if ! ls "$results" | grep -q "$suite"; then
              echo "$suite did not run." >&2
              exit 1
            fi
          done

      # WHAT THE SANDBOX ACTUALLY SAW OF THE SOURCE MOUNT, in the log, on a passing run.
      #
      # The suite asserts these; this prints them. The distinction matters because the mount-flag findings are
      # the honest part of this slice: `ro` is carried onto a mediated bind and `noexec` is not, and that gap
      # is the reason KAAS-18 does not declare tenant code execution ready. A reader of a green run should be
      # able to see the measurement rather than take the verdict on trust.
      - name: Report the mediated source-delivery evidence
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/source-delivery-evidence.txt"
          if [ ! -f "$evidence" ]; then
            echo "The source-delivery suite produced no evidence file; it cannot have observed a mount." >&2
            exit 1
          fi
          cat "$evidence"
          # Read back the properties the gate depends on, from what the sandbox reported rather than from the
          # test's own summary of it.
          grep -q '^source_verification=VALID$' "$evidence"
          grep -q '^source_filesystem=tmpfs$' "$evidence"

          # THE THREE THE FILESYSTEM ENFORCES.
          grep -q '^source_mount_ro=true$' "$evidence"
          grep -q '^source_mount_noexec=true$' "$evidence"
          grep -q '^source_mount_nosuid=true$' "$evidence"
          grep -q '^source_write_refused=true$' "$evidence"
          grep -q '^source_remount_refused=true$' "$evidence"

          # AND THE CONTROL THAT MAKES noexec MEAN SOMETHING. An identical, genuinely executable fixture on a
          # permissive filesystem in the same sandbox. Without the first line the second is consistent with a
          # file that was never runnable, which is the ambiguity KAAS-18 ended on.
          grep -q '^exec_control=EXECUTED$' "$evidence"
          grep -q '^exec_hardened=REFUSED$' "$evidence"

          # nosuid, reported and unobservable. This runtime performs no setuid transition on ANY filesystem --
          # measured, while the baseline runtime escalates in the identical test -- so the flag has no red
          # path here. If the control ever escalates, the runtime changed and the claim needs redoing.
          grep -q '^suid_control=NOT_ESCALATED$' "$evidence"
          grep -q '^suid_hardened=REFUSED$' "$evidence"
          # BOTH COUNTS, because they are different claims. The measurement plants a setuid fixture on the
          # source filesystem deliberately -- without it the two comparisons above would be vacuous -- so its
          # own count is one. What a real delivery must satisfy is that a bundle brings none of its own.
          grep -q '^source_setuid_files=1$' "$evidence"
          grep -q '^delivery_setuid_files=0$' "$evidence"
          grep -q '^delivery_irregular_entries=0$' "$evidence"

          # THE GAP THIS SLICE DID NOT CLOSE, recorded as a fact rather than as an omission. gVisor does not
          # implement MS_NODEV: the flag is absent from every tmpfs measured, and a device node on one still
          # behaves as a device. If this line ever changes, the runtime gained it and
          # docs/security/mediated-source-filesystem.md must be re-adjudicated.
          grep -q '^source_mount_nodev=false$' "$evidence"
          grep -q '^source_irregular_entries=0$' "$evidence"

          # THE CONSUMER KEEPS NOTHING FROM CONSTRUCTION. The bootstrap held CAP_SYS_ADMIN to close the
          # filesystem; this is read out of /proc by the process that would eventually run tenant content.
          grep -q '^final_consumer_capabilities=EMPTY$' "$evidence"
          grep -q '^source_ingress_visible=0$' "$evidence"
          # NoNewPrivs is not observable under this runtime, which is the same absence KAAS-17 recorded for
          # the NO_NEW_PRIVILEGES control. Asserted as unsupported rather than dropped, so a runtime that
          # gains it fails here and the claim gets upgraded rather than quietly assumed.
          grep -q '^source_no_new_privileges=unsupported$' "$evidence"

      # WHAT THE BOUNDARY DOES WHEN THE WORKLOAD IS A JVM.
      #
      # Every other hostile probe here is a shell script. The engine that would run tenant code is a JVM, and
      # Karate 2.1.2 resolves Java.type to Class.forName with no allowlist -- so tenant source is arbitrary
      # JVM code and this is the posture that actually matters.
      - name: Report the hostile JVM containment evidence
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/hostile-jvm-evidence.txt"
          if [ ! -f "$evidence" ]; then
            echo "The hostile JVM suite produced no evidence file; it cannot have run a JVM." >&2
            exit 1
          fi
          cat "$evidence"
          # The process a future engine would be, read out of its own /proc.
          grep -q '^java_capabilities=EMPTY$' "$evidence"
          # Requested by the launcher and set by the bootstrap; this runtime does not expose it for reading
          # back, which is the same absence KAAS-17 recorded for the NO_NEW_PRIVILEGES control.
          grep -q '^java_no_new_privs=unsupported$' "$evidence"
          grep -q '^java_uid=65534$' "$evidence"
          # The source filesystem, attacked from Java rather than from shell.
          grep -q '^java_source_write=false$' "$evidence"
          grep -q '^java_source_exec=false$' "$evidence"
          grep -q '^java_remount=false$' "$evidence"
          # THE COMPENSATING CONTROL FOR THE MISSING nodev, from the attacker's side.
          grep -q '^java_mknod=false$' "$evidence"
          # Generated code: the write must succeed and the execution must not, or noexec on /kaas/source
          # would be irrelevant to a workload that writes its own program.
          grep -q '^java_tmp_write=true$' "$evidence"
          grep -q '^java_tmp_exec=false$' "$evidence"
          # Raw Java networking, ignoring any engine's own HTTP client.
          grep -q '^java_raw_direct_egress=false$' "$evidence"
          grep -q '^java_dns=false$' "$evidence"
          # Not findings, recorded because the model says so: arbitrary code may spawn and thread, and the
          # profile must bound it.
          grep -q '^java_child_spawned=true$' "$evidence"
          # THE THREAD FINDING, recorded in the direction it is true. gVisor does not charge Java threads
          # against the pids limit -- 200 of 200 attempted start here, where the baseline runtime stops at 49.
          # If this ever becomes true, the runtime began bounding them and the residual risk is gone.
          grep -qE '^java_threads_bounded=false$' "$evidence"

      # Tenant bytes are the one thing in this repository that must not survive the job that used them.
      - name: Confirm no tenant source outlived the gate
        run: |
          set -euo pipefail
          # There is no host staging any more -- source travels from memory into the sandbox's own filesystem
          # and dies with the container -- so this asserts an absence that should now be structural rather
          # than swept. A directory appearing here would mean a host copy came back.
          stale=$(find /tmp "$RUNNER_TEMP" -maxdepth 1 -type d -name 'kaas-*source*' 2>/dev/null | wc -l | tr -d ' ')
          echo "stale_source_dirs=$stale"
          if [ "$stale" -ne 0 ]; then
            find /tmp "$RUNNER_TEMP" -maxdepth 1 -type d -name 'kaas-*source*' >&2
            echo "Tenant source staging outlived the suite that created it." >&2
            exit 1
          fi

      - name: Confirm nothing outlived the run
        run: |
          set -euo pipefail
          containers=$(docker ps -aq --filter label=kaas.managed=true | wc -l | tr -d ' ')
          networks=$(docker network ls -q --filter label=kaas.managed=true | wc -l | tr -d ' ')
          # A mediated sandbox leaves a sentry process behind if the container is not reaped, so this is not
          # only about Docker objects.
          #
          # MATCHED ON THE PROCESS'S FIRST TOKEN, not on any mention of the runtime.
          #
          # Two wrong versions preceded this one and each failed in the opposite direction. `pgrep -c` on the
          # runtime name could only ever return zero, because gVisor re-executes its sentry so the process NAME
          # is not the runtime's -- measured: zero while a mediated sandbox was demonstrably running. Grepping
          # the whole argument list could only ever return one or more, because this very script mentions the
          # runtime and its own command line is in the process table -- measured: one, on a clean run.
          #
          # The first token is the executable. This script's is bash, grep's is grep, and a sentry's is
          # runsc-sandbox, so the answer depends on whether anything leaked. That is the entire point of it.
          sentries=$(ps -eo args= | awk '{print $1}' | grep -cE '(^|/)runsc(-sandbox|-gofer)?$' || true)
          echo "containers=$containers networks=$networks runsc_processes=${sentries:-0}"
          if [ "$containers" -ne 0 ] || [ "$networks" -ne 0 ] || [ "${sentries:-0}" -ne 0 ]; then
            echo "Resources outlived the suite." >&2
            exit 1
          fi

      - name: Remove anything left behind by a failed run
        if: always()
        run: |
          docker ps -aq --filter label=kaas.managed=true | xargs -r docker rm -f
          docker network ls -q --filter label=kaas.managed=true | xargs -r docker network rm

  # THE DEPLOYMENT-READINESS GATE (KAAS-DEPLOY-001). One job, because it owns one question -- can the application
  # be handed to Operations -- and every step below is evidence for part of that answer:
  #
  #   the runner's work intake is the authenticated internal claim API, never RabbitMQ;
  #   the production runner composition claims, executes Karate under runsc, and shuts down clean;
  #   the migrator migrates and the application, in production, does not;
  #   attestation and service identity refresh without a restart;
  #   five images carry one revision and are handed off by registry digest;
  #   and a dispatch RabbitMQ loses after publication is reconstructed from PostgreSQL as the SAME dispatch and
  #   runs to completion under runsc (KAAS-MSG-001) -- while the queue deadline still ends one that cannot be.
  #
  # KAAS-DEPLOY-001 required rabbitmq_loss_recovery=false: it measured the blocker. KAAS-MSG-001 closed it, and the
  # gate now requires the recovery evidence instead, and keeps requiring the deadline safety net.
  deployment-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/api-contracts/package-lock.json
      - run: npm ci
        working-directory: packages/api-contracts
      - uses: ./.github/actions/install-mediating-runtime

      # ---- control plane: claim intake, broker loss, migrator and roles, submitted attestations
      - run: ./gradlew :apps:api:cleanDeploymentReadinessTest :apps:api:deploymentReadinessTest --no-daemon
      - name: Confirm the control-plane suites ran whole
        run: |
          set -euo pipefail
          python3 .github/scripts/junit-gate.py apps/api/build/test-results/deploymentReadinessTest \
            --require com.kaas.api.WorkerClaimEndpointTests=12 \
            --require com.kaas.api.BrokerLossMeasurementTests=4 \
            --require com.kaas.api.DispatchRecoveryTests=16 \
            --require com.kaas.api.AttestationSubmissionTests=8 \
            --require com.kaas.api.deployment.MigrationModeTests=8 \
            --require com.kaas.api.deployment.DeploymentStatusTests=5
      # KAAS-MSG-001: the lost dispatch is reconstructed from PostgreSQL as the same dispatch, and every race settles
      # to one decision, one claim, one outcome. Each line is written from what the suite observed.
      - name: Confirm dispatch recovery and its races
        run: |
          set -euo pipefail
          evidence=apps/api/build/evidence/deploymentReadinessTest
          python3 .github/scripts/evidence-gate.py "$evidence/dispatch-recovery.properties" \
            initial_publish_confirmed=true broker_depth_before_loss=1 broker_depth_after_loss=0 \
            broker_message_destroyed=true dispatch_recovery_eligible=true recovery_publish_confirmed=true \
            recovery_publications=1 stable_message_identity=true stable_dispatch_identity=true \
            stable_payload_digest=true stable_payload_bytes=true delivered_after_recovery=true \
            runner_claimed_after_recovery=true execution_attempts=1 rabbitmq_loss_recovery=true
          python3 .github/scripts/evidence-gate.py "$evidence/duplicate-race.properties" \
            duplicate_race_decisions=1 duplicate_race_deliveries=2 duplicate_race_claims=1
          python3 .github/scripts/evidence-gate.py "$evidence/crash-recovery.properties" \
            crash_after_confirm_republished=true crash_after_confirm_decisions=1 crash_after_confirm_claims=1
          python3 .github/scripts/evidence-gate.py "$evidence/cancellation-race.properties" \
            cancellation_before_republish_published=false cancellation_after_republish_consumer=STALE \
            cancelled_run_resurrected=false
          python3 .github/scripts/evidence-gate.py "$evidence/deadline-race.properties" \
            deadline_race_published_after_deadline=false deadline_race_resurrected=false
          python3 .github/scripts/evidence-gate.py "$evidence/deadline-late-copy.properties" \
            late_recovered_copy_consumer=STALE late_recovered_copy_claims=0 late_recovered_copy_resurrected=false
      # Recovery does not remove the safety net: a loss recovery cannot repair still ends at the queue deadline.
      - name: Confirm the queue deadline still fails closed
        run: |
          set -euo pipefail
          python3 .github/scripts/evidence-gate.py \
            apps/api/build/evidence/deploymentReadinessTest/broker-loss.properties \
            recovery_attempted=true recovery_publish_confirmed=false \
            terminal_outcome=TIMED_OUT/QUEUE_DEADLINE queue_deadline_fail_closed=true

      # ---- runner: lifecycle, configuration, identity, and no broker on its classpath
      - run: >-
          ./gradlew :services:runner:cleanTest :services:runner:test --no-daemon
          --tests 'com.kaas.runner.daemon.*' --tests com.kaas.runner.RunnerApplicationTest
          :services:runner:verifyLauncherHasNoUserContentDependencies
      - name: Confirm the runner suites ran whole
        run: |
          set -euo pipefail
          python3 .github/scripts/junit-gate.py services/runner/build/test-results/test \
            --require com.kaas.runner.daemon.RunnerDaemonLifecycleTests=18 \
            --require com.kaas.runner.daemon.ProductionRunnerCompositionTests=3 \
            --require com.kaas.runner.daemon.RuntimePreflightTests=4 \
            --require com.kaas.runner.daemon.RunnerConfigurationTests=5 \
            --require com.kaas.runner.daemon.ServiceIdentityClientCredentialsTests=4 \
            --require com.kaas.runner.RunnerApplicationTest=2

      # ---- the deployed shape, end to end, under runsc
      - run: ./gradlew :tests:pipeline:cleanDeploymentPipelineTest :tests:pipeline:deploymentPipelineTest --no-daemon
      - name: Confirm the production composition ran whole
        run: |
          set -euo pipefail
          python3 .github/scripts/junit-gate.py tests/pipeline/build/test-results/deploymentPipelineTest \
            --require com.kaas.pipeline.DeploymentPipelineTests=6
          python3 .github/scripts/evidence-gate.py \
            tests/pipeline/build/evidence/deploymentPipelineTest/deployment-pipeline-evidence.txt \
            suite=DeploymentPipelineTests deploy_check_without_runner=NOT_READY \
            runner_composition=RunnerComposition.compose runner_ready=true attestation_submitted_by_runner=true \
            deploy_check_with_runner=READY claim_path=RABBITMQ_TO_API_CONSUMER_TO_RUNNER_CLAIM \
            inbox_disposition=DELIVERED assigned_worker=kaas.worker.deployment-pipeline \
            run_outcome=COMPLETED/PASSED sandbox_runtime=runsc runner_containers_after_shutdown=0 \
            ordinary_run_recovered=false
          # The main acceptance path: a real broker loss, reconstructed from PostgreSQL, admitted by the API
          # consumer, claimed by the production runner and executed by Karate under runsc.
          python3 .github/scripts/evidence-gate.py \
            tests/pipeline/build/evidence/deploymentPipelineTest/recovery-pipeline-evidence.txt \
            initial_publish_confirmed=true broker_depth_before_loss=1 broker_depth_after_loss=0 \
            broker_message_destroyed=true recovery_publish_confirmed=true stable_message_identity=true \
            stable_payload_digest=true delivered_after_recovery=true consumer_deliveries=1 \
            runner_claimed_after_recovery=true execution_attempts=1 run_outcome=COMPLETED/PASSED \
            sandbox_runtime=runsc rabbitmq_loss_recovery=true
      - name: Confirm nothing outlived the suites
        if: always()
        run: .github/scripts/leak-gate.sh

      # ---- images and the release manifest, rehearsed against a real registry
      #
      # The same script the release workflow runs, pushing to a registry that lives only for this job. Digests
      # come from the registry, and the verifier pulls every image back BY DIGEST and reads its revision label.
      - name: Build, push and verify a release manifest
        run: |
          set -euo pipefail
          docker run -d --name kaas-release-registry -p 127.0.0.1:5000:5000 registry:2.8.3 >/dev/null
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:5000/v2/ >/dev/null && break; sleep 1; done
          infrastructure/release/build-release.sh localhost:5000/kaas "$(git rev-parse HEAD)" \
            "$RUNNER_TEMP/release-manifest.json" | tee "$RUNNER_TEMP/release.log"
          grep -qx 'release_manifest=VALID' "$RUNNER_TEMP/release.log"
          cat "$RUNNER_TEMP/release-manifest.json"
      # The verifier's refusals, checked against the real registry rather than assumed from its fixtures: an
      # image stamped with another revision, a tag instead of a digest, and a missing component.
      - name: Confirm the verifier refuses what it must
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/release-manifest.json"
          verify() { node packages/api-contracts/scripts/verify-release-manifest.mjs "$@"; }
          printf 'FROM %s\n' "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["images"]["api"])' "$manifest")" \
            | docker build -q --label org.opencontainers.image.revision=0000000000000000000000000000000000000000 \
                -t localhost:5000/kaas/kaas-api:wrong-revision - >/dev/null
          docker push --quiet localhost:5000/kaas/kaas-api:wrong-revision >/dev/null
          wrong=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            localhost:5000/kaas/kaas-api:wrong-revision | grep -F 'localhost:5000/kaas/kaas-api@' | head -1)
          python3 - "$manifest" "$wrong" "$RUNNER_TEMP" <<'PY'
          import json, sys
          manifest, wrong, out = sys.argv[1], sys.argv[2], sys.argv[3]
          base = json.load(open(manifest))
          relabelled = json.loads(json.dumps(base)); relabelled["images"]["api"] = wrong
          tagged = json.loads(json.dumps(base)); tagged["images"]["runner"] = "localhost:5000/kaas/kaas-runner:latest"
          missing = json.loads(json.dumps(base)); del missing["images"]["security-probe"]
          for name, value in (("relabelled", relabelled), ("tagged", tagged), ("missing", missing)):
              json.dump(value, open(f"{out}/manifest-{name}.json", "w"))
          PY
          for mutant in relabelled tagged missing; do
            if verify "$RUNNER_TEMP/manifest-$mutant.json" --expect-revision "$(git rev-parse HEAD)" --check-labels; then
              echo "The verifier accepted a $mutant manifest." >&2
              exit 1
            fi
            echo "refused: $mutant"
          done
      # The migrator AS SHIPPED: the API image's `migrate` mode, the migrator role from roles.sql, a real
      # PostgreSQL. It migrates, is idempotent, starts no application, and the application role cannot do it.
      - name: Run the shipped migrator against the Operations role split
        run: |
          set -euo pipefail
          api=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["images"]["api"])' "$RUNNER_TEMP/release-manifest.json")
          docker network create kaas-migration >/dev/null
          docker run -d --name kaas-migration-db --network kaas-migration -e POSTGRES_PASSWORD=owner \
            -e POSTGRES_DB=kaas postgres:16.10-alpine >/dev/null
          # The image runs a temporary server while it initializes and then restarts; pg_isready can answer the
          # temporary one moments before it shuts down (it did, in CI). Wait for initialization to finish first.
          for _ in $(seq 1 90); do
            docker logs kaas-migration-db 2>&1 | grep -q 'PostgreSQL init process complete' \
              && docker exec kaas-migration-db pg_isready -U postgres -d kaas >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec -i kaas-migration-db psql -U postgres -d kaas -v ON_ERROR_STOP=1 \
            -v migrator_password=migrator-ci -v app_password=app-ci -f - < infrastructure/database/roles.sql
          migrate() {
            docker run --rm --network kaas-migration \
              -e KAAS_MIGRATOR_DATABASE_URL=jdbc:postgresql://kaas-migration-db:5432/kaas \
              -e KAAS_MIGRATOR_DATABASE_USERNAME="$1" -e KAAS_MIGRATOR_DATABASE_PASSWORD="$2" "$api" migrate
          }
          first=$(migrate kaas_migrator migrator-ci); echo "$first"
          echo "$first" | grep -q '^migration=CURRENT applied=[1-9]'
          second=$(migrate kaas_migrator migrator-ci); echo "$second"
          echo "$second" | grep -q '^migration=CURRENT applied=0'
          # Only migration lines: no banner, no web server, no scheduler -- and never the URL or a credential.
          if echo "$first$second" | grep -qiE 'tomcat|started kaasapiapplication|spring'; then
            echo "The migrator started more than Flyway." >&2
            exit 1
          fi
          if echo "$first$second" | grep -qE 'jdbc:|migrator-ci'; then
            echo "The migrator printed its connection URL or password." >&2
            exit 1
          fi
          [ "$(echo "$first" | wc -l)" -eq 1 ] || { echo "The migrator printed more than its contract line." >&2; exit 1; }
          docker exec kaas-migration-db psql -U postgres -d kaas -v ON_ERROR_STOP=1 -c "create database kaas_app_attempt owner kaas_migrator"
          refused=$(docker run --rm --network kaas-migration \
               -e KAAS_MIGRATOR_DATABASE_URL=jdbc:postgresql://kaas-migration-db:5432/kaas_app_attempt \
               -e KAAS_MIGRATOR_DATABASE_USERNAME=kaas_app -e KAAS_MIGRATOR_DATABASE_PASSWORD=app-ci "$api" migrate) \
            && { echo "The application role was able to migrate." >&2; exit 1; }
          echo "$refused"
          # Refused BY PRIVILEGE (42501), not by some unrelated failure that would look the same from the exit code.
          echo "$refused" | grep -q '^migration=FAILED .*sqlState=42501'
          echo "application role refused DDL: yes"
          docker rm -f kaas-migration-db >/dev/null
          docker network rm kaas-migration >/dev/null

      # ---- the verdict
      - name: Report the deployment-readiness verdict
        run: |
          set -euo pipefail
          {
            echo "## Deployment readiness (KAAS-DEPLOY-001)"
            echo
            echo '```'
            echo "revision=$(git rev-parse HEAD)"
            echo "runner_work_intake=INTERNAL_CLAIM_API"
            echo "runner_rabbitmq_dependency=NONE"
            cat apps/api/build/evidence/deploymentReadinessTest/*.properties
            cat tests/pipeline/build/evidence/deploymentPipelineTest/deployment-pipeline-evidence.txt
            cat tests/pipeline/build/evidence/deploymentPipelineTest/recovery-pipeline-evidence.txt
            echo "release_manifest=VALID"
            echo "verdict=MESSAGING RECOVERY COMPLETE — APPLICATION DEPLOYMENT CONTRACT READY"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deployment-readiness-evidence
          path: |
            ${{ runner.temp }}/release-manifest.json
            apps/api/build/evidence/deploymentReadinessTest/
            tests/pipeline/build/evidence/deploymentPipelineTest/
          if-no-files-found: warn

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/api-contracts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/api-contracts/package-lock.json
      - run: npm ci
      - run: npm run validate:schemas
      - run: npm run verify:release-manifest
      - run: npm run lint:openapi

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: docker compose -f infrastructure/local/docker-compose.yml config
      - run: bash -n infrastructure/release/build-release.sh
      # The release workflow's one guarantee -- only a full commit sha with green CI is released -- checked on every
      # push: no expression reaches shell source, the revision is validated first and strictly, and the lookup,
      # checkout and build use the validated value. actionlint is pinned by digest.
      - name: Check the release workflow treats its input as data
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user pyyaml==6.0.2
          python3 .github/scripts/check-release-workflow.py .github/workflows/release-images.yml
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -no-color .github/workflows/release-images.yml
